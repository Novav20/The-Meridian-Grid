<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 710" width="100%" height="100%" style="background-color: #16191F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#212631" />
      <stop offset="100%" stop-color="#1A1E26" />
    </linearGradient>
    
    <!-- Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#388bfd" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Canvas Background (Opaque #16191F with rx=12) -->
  <rect width="1180" height="710" rx="12" fill="#16191F" />

  <!-- Title & Subtitle -->
  <text x="590" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#f0f6fc">Declarative SVG Component Hierarchy &amp; Zero-Reflow GPU Pipeline</text>
  <text x="590" y="60" text-anchor="middle" font-size="12" fill="#8b949e">Reusable Master Symbols in &lt;defs&gt;, Instantiation via &lt;use&gt;, and Direct GPU Compositor Mutation vs. innerHTML Reflow</text>

  <!-- ==================== LEFT PANEL: SVG DOM ARCHITECTURE & MEMORY ==================== -->
  <rect x="35" y="80" width="535" height="605" rx="8" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1" />
  
  <rect x="50" y="92" width="280" height="22" rx="4" fill="#16191F" stroke="#388bfd" stroke-width="1" />
  <circle cx="62" cy="103" r="4" fill="#388bfd" />
  <text x="74" y="107" font-size="11" font-weight="700" fill="#79c0ff">1. Master Library &amp; Shadow DOM</text>
  <text x="50" y="132" font-size="10" fill="#8b949e">Declarative Symbol Reuse: &lt;defs&gt; Templates vs. &lt;use&gt; Pointers</text>

  <!-- Sub-Card A: Master Template in <defs> -->
  <rect x="50" y="145" width="505" height="175" rx="6" fill="#16191F" stroke="#388bfd" stroke-width="1" />
  <rect x="60" y="155" width="250" height="20" rx="3" fill="#122638" />
  <text x="68" y="169" font-size="10" font-family="monospace" font-weight="700" fill="#79c0ff">&lt;defs&gt; Master Template (Heap Memory)</text>

  <!-- Visual Symbol Drawing -->
  <rect x="70" y="190" width="70" height="70" rx="6" fill="#0d1117" stroke="#30363D" stroke-width="1" />
  <rect x="85" y="205" width="40" height="40" rx="4" fill="#16191F" stroke="#79c0ff" stroke-width="1.5" />
  <line x1="105" y1="193" x2="105" y2="205" stroke="#79c0ff" stroke-width="2" />
  <line x1="105" y1="245" x2="105" y2="257" stroke="#79c0ff" stroke-width="2" />
  <line x1="105" y1="205" x2="105" y2="245" stroke="#f85149" stroke-width="2.5" />
  <text x="105" y="275" font-size="8" font-family="monospace" text-anchor="middle" fill="#8b949e">#cgs-breaker</text>

  <!-- Code for Template -->
  <g xml:space="preserve" font-family="monospace" font-size="8.5" fill="#8b949e">
    <text x="160" y="195">&lt;<tspan fill="#79c0ff">g</tspan> <tspan fill="#d2a8ff">id</tspan>=<tspan fill="#a5d6ff">"cgs-breaker"</tspan>&gt;</text>
    <text x="175" y="215">&lt;<tspan fill="#79c0ff">rect</tspan> <tspan fill="#d2a8ff">class</tspan>=<tspan fill="#a5d6ff">"housing"</tspan> <tspan fill="#d2a8ff">width</tspan>=<tspan fill="#a5d6ff">"30"</tspan> <tspan fill="#d2a8ff">height</tspan>=<tspan fill="#a5d6ff">"30"</tspan>/&gt;</text>
    <text x="175" y="235">&lt;<tspan fill="#79c0ff">line</tspan> <tspan fill="#d2a8ff">class</tspan>=<tspan fill="#a5d6ff">"terminal-top"</tspan> <tspan fill="#d2a8ff">x1</tspan>=<tspan fill="#a5d6ff">"0"</tspan> <tspan fill="#d2a8ff">y1</tspan>=<tspan fill="#a5d6ff">"-15"</tspan>/&gt;</text>
    <text x="175" y="255">&lt;<tspan fill="#79c0ff">line</tspan> <tspan fill="#d2a8ff">class</tspan>=<tspan fill="#a5d6ff">"cgs-blade"</tspan> <tspan fill="#d2a8ff">x1</tspan>=<tspan fill="#a5d6ff">"0"</tspan> <tspan fill="#d2a8ff">y1</tspan>=<tspan fill="#a5d6ff">"6"</tspan> <tspan fill="#d2a8ff">x2</tspan>=<tspan fill="#a5d6ff">"0"</tspan> <tspan fill="#d2a8ff">y2</tspan>=<tspan fill="#a5d6ff">"-6"</tspan>/&gt;</text>
    <text x="160" y="275">&lt;/<tspan fill="#79c0ff">g</tspan>&gt;</text>
  </g>
  <text x="160" y="302" font-size="8.5" fill="#3fb950">&#10003; Parsed &amp; stored exactly ONCE in V8 DOM heap (~1.2 KB)</text>

  <!-- Pointer arrow from defs to instances -->
  <path d="M 302 320 L 302 342" fill="none" stroke="#388bfd" stroke-width="2" marker-end="url(#arrowBlue)" />

  <!-- Sub-Card B: Shadow Instantiations via <use> -->
  <rect x="50" y="345" width="505" height="185" rx="6" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <rect x="60" y="355" width="310" height="20" rx="3" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <text x="68" y="369" font-size="10" font-family="monospace" font-weight="700" fill="#c9d1d9">&lt;use&gt; Shadow Pointers on Live Canvas</text>

  <g xml:space="preserve" font-family="monospace" font-size="8.5" fill="#8b949e">
    <text x="65" y="395">&lt;<tspan fill="#79c0ff">use</tspan> <tspan fill="#d2a8ff">href</tspan>=<tspan fill="#a5d6ff">"#cgs-breaker"</tspan></text>
    <text x="95" y="415"><tspan fill="#d2a8ff">id</tspan>=<tspan fill="#79c0ff">"Alpha_110kV_Bay01_QA1_XCBR1"</tspan></text>
    <text x="95" y="435"><tspan fill="#d2a8ff">x</tspan>=<tspan fill="#a5d6ff">"450"</tspan> <tspan fill="#d2a8ff">y</tspan>=<tspan fill="#a5d6ff">"320"</tspan></text>
    <text x="95" y="455"><tspan fill="#d2a8ff">class</tspan>=<tspan fill="#a5d6ff">"cgs-breaker"</tspan> <tspan fill="#d2a8ff">data-state</tspan>=<tspan fill="#f85149">"cgs-closed"</tspan></text>
    <text x="95" y="475"><tspan fill="#d2a8ff">data-topic</tspan>=<tspan fill="#a5d6ff">"Enterprise/Alpha/110kV/Bay01/QA1/Pos"</tspan>/&gt;</text>
  </g>

  <rect x="60" y="490" width="485" height="28" rx="3" fill="#0d1117" stroke="#30363D" stroke-width="1" />
  <text x="70" y="508" font-size="8.5" font-family="monospace" fill="#79c0ff">Pointer Instance: Lightweight Shadow Root referencing #cgs-breaker</text>

  <!-- Memory Benchmark Comparison Card -->
  <rect x="50" y="545" width="505" height="125" rx="6" fill="#16191F" stroke="#3fb950" stroke-width="1" />
  <text x="65" y="565" font-size="10.5" font-weight="700" fill="#3fb950">&#10003; Memory Conservation Benchmark (1,000 Breakers):</text>
  <text x="65" y="585" font-size="9" fill="#c9d1d9">&#8226; <tspan font-weight="700">Raw Element Duplication:</tspan> 1,000 &#215; 4 child nodes = 4,000 nodes (~18.4 MB V8 heap)</text>
  <text x="65" y="603" font-size="9" fill="#c9d1d9">&#8226; <tspan font-weight="700">Master &lt;defs&gt; + &lt;use&gt; Reuse:</tspan> 4 template nodes + 1,000 shadow refs (~2.8 MB V8 heap)</text>
  <text x="65" y="621" font-size="9" font-weight="700" fill="#79c0ff">&#8594; 85% Memory Reduction &amp; Zero DOM Tree Garbage Churn</text>
  <rect x="65" y="632" width="475" height="26" rx="3" fill="#122619" />
  <text x="75" y="649" font-size="8.5" font-family="monospace" fill="#3fb950">&#10003; Sustains steady 60 FPS under continuous zoom/pan operations</text>

  <!-- ==================== RIGHT PANEL: BROWSER RENDERING PIPELINE ==================== -->
  <rect x="610" y="80" width="535" height="605" rx="8" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1" />
  
  <rect x="625" y="92" width="280" height="22" rx="4" fill="#16191F" stroke="#388bfd" stroke-width="1" />
  <circle cx="637" cy="103" r="4" fill="#388bfd" />
  <text x="649" y="107" font-size="11" font-weight="700" fill="#79c0ff">2. Browser Rendering Engine</text>
  <text x="625" y="132" font-size="10" fill="#8b949e">Execution Pipeline: CPU Layout Reflow vs. GPU Compositor Bypass</text>

  <!-- Pipeline A: ANTI-PATTERN (innerHTML) -->
  <rect x="625" y="145" width="505" height="230" rx="6" fill="#16191F" stroke="#f85149" stroke-width="1" />
  <rect x="635" y="155" width="290" height="20" rx="3" fill="#2d1519" />
  <text x="642" y="169" font-size="10" font-family="monospace" font-weight="700" fill="#f85149">&#10006; ANTI-PATTERN: container.innerHTML = svg</text>

  <!-- Flow Steps Box -->
  <g font-family="monospace" font-size="8.5">
    <!-- Step 1 -->
    <rect x="635" y="185" width="75" height="38" rx="3" fill="#16191F" stroke="#30363D" stroke-width="1" />
    <text x="672" y="200" text-anchor="middle" fill="#79c0ff">WebSocket</text>
    <text x="672" y="213" text-anchor="middle" fill="#8b949e">Push</text>
    <path d="M 710 204 L 725 204" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrowRed)" />

    <!-- Step 2 -->
    <rect x="725" y="185" width="75" height="38" rx="3" fill="#2d1519" stroke="#f85149" stroke-width="1" />
    <text x="762" y="200" text-anchor="middle" fill="#f85149">Destroy</text>
    <text x="762" y="213" text-anchor="middle" fill="#f85149">DOM Nodes</text>
    <path d="M 800 204 L 815 204" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrowRed)" />

    <!-- Step 3 -->
    <rect x="815" y="185" width="75" height="38" rx="3" fill="#2d1519" stroke="#f85149" stroke-width="1" />
    <text x="852" y="200" text-anchor="middle" fill="#f85149">XML Parse</text>
    <text x="852" y="213" text-anchor="middle" fill="#f85149">&amp; Recalc</text>
    <path d="M 890 204 L 905 204" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrowRed)" />

    <!-- Step 4: REFLOW -->
    <rect x="905" y="180" width="105" height="48" rx="4" fill="#3d1519" stroke="#f85149" stroke-width="2" />
    <text x="957" y="200" text-anchor="middle" font-weight="700" fill="#f85149">LAYOUT REFLOW</text>
    <text x="957" y="216" text-anchor="middle" fill="#ff7b72">Heavy CPU Stall</text>
    <path d="M 1010 204 L 1025 204" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrowRed)" />

    <!-- Step 5 -->
    <rect x="1025" y="185" width="90" height="38" rx="3" fill="#16191F" stroke="#30363D" stroke-width="1" />
    <text x="1070" y="200" text-anchor="middle" fill="#8b949e">Paint (CPU)</text>
    <text x="1070" y="213" text-anchor="middle" fill="#8b949e">&amp; Composite</text>
  </g>

  <!-- Penalty Text -->
  <text x="635" y="250" font-size="9" fill="#c9d1d9">&#8226; <tspan font-weight="700" fill="#f85149">Execution Latency: 16 to 50 ms per update</tspan></text>
  <text x="635" y="268" font-size="9" fill="#8b949e">&#8226; Forces browser to recalculate bounding boxes for every line &amp; busbar</text>
  <text x="635" y="286" font-size="9" fill="#8b949e">&#8226; Triggers massive V8 garbage collector pauses and severe frame stutter</text>
  <rect x="635" y="300" width="485" height="32" rx="3" fill="#2d1519" stroke="#f85149" stroke-width="1" />
  <text x="645" y="320" font-size="9" font-family="monospace" font-weight="700" fill="#f85149">&#10006; DISASTER: Frame drops below 10 FPS; operator UI freezes</text>

  <!-- Pipeline B: HIGH-PERFORMANCE ZERO-REFLOW (setAttribute) -->
  <rect x="625" y="390" width="505" height="280" rx="6" fill="#16191F" stroke="#3fb950" stroke-width="1" />
  <rect x="635" y="400" width="370" height="20" rx="3" fill="#122619" />
  <text x="642" y="414" font-size="10" font-family="monospace" font-weight="700" fill="#3fb950">&#10003; Targeted Attribute Mutation</text>

  <!-- Flow Steps Box -->
  <g font-family="monospace" font-size="8.5">
    <!-- Step 1 -->
    <rect x="635" y="430" width="80" height="38" rx="3" fill="#16191F" stroke="#30363D" stroke-width="1" />
    <text x="675" y="445" text-anchor="middle" fill="#79c0ff">WebSocket</text>
    <text x="675" y="458" text-anchor="middle" fill="#8b949e">Delta Push</text>
    <path d="M 715 449 L 730 449" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowGreen)" />

    <!-- Step 2 -->
    <rect x="730" y="430" width="80" height="38" rx="3" fill="#16191F" stroke="#30363D" stroke-width="1" />
    <text x="770" y="445" text-anchor="middle" fill="#79c0ff">O(1) getElement</text>
    <text x="770" y="458" text-anchor="middle" fill="#8b949e">ById(ID)</text>
    <path d="M 810 449 L 825 449" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowGreen)" />

    <!-- Step 3 -->
    <rect x="825" y="430" width="85" height="38" rx="3" fill="#122619" stroke="#3fb950" stroke-width="1" />
    <text x="867" y="445" text-anchor="middle" fill="#3fb950">setAttribute</text>
    <text x="867" y="458" text-anchor="middle" fill="#3fb950">('data-state')</text>
    <path d="M 910 449 L 925 449" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowGreen)" />

    <!-- Step 4: BYPASS BOX -->
    <rect x="925" y="425" width="90" height="48" rx="4" fill="#16191F" stroke="#3fb950" stroke-dasharray="3,2" stroke-width="1.5" />
    <text x="970" y="444" text-anchor="middle" font-size="8" font-weight="700" fill="#3fb950">BYPASS</text>
    <text x="970" y="458" text-anchor="middle" font-size="7.5" fill="#8b949e">Layout &amp; Paint</text>
    <path d="M 1015 449 L 1030 449" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowGreen)" />

    <!-- Step 5: GPU Compositor -->
    <rect x="1030" y="425" width="90" height="48" rx="4" fill="#122619" stroke="#3fb950" stroke-width="2" />
    <text x="1075" y="444" text-anchor="middle" font-weight="700" fill="#3fb950">GPU MATRIX</text>
    <text x="1075" y="458" text-anchor="middle" font-size="7.5" fill="#79c0ff">rotate / stroke</text>
  </g>

  <!-- Performance Guarantees -->
  <text x="635" y="495" font-size="9" fill="#c9d1d9">&#8226; <tspan font-weight="700" fill="#3fb950">Execution Latency: &lt; 0.5 ms per update</tspan></text>
  <text x="635" y="513" font-size="9" fill="#c9d1d9">&#8226; Existing DOM tree and geometry preserved intact</text>
  <text x="635" y="531" font-size="9" fill="#c9d1d9">&#8226; CSS transforms (`transform: rotate()`) execute directly on GPU compositor thread</text>
  <text x="635" y="549" font-size="9" fill="#c9d1d9">&#8226; Main JavaScript thread remains 100% responsive for operator control inputs</text>

  <!-- Code Inset Box -->
  <rect x="635" y="562" width="485" height="50" rx="3" fill="#0d1117" stroke="#30363D" stroke-width="1" />
  <g xml:space="preserve" font-family="monospace" font-size="8" fill="#8b949e">
    <text x="645" y="580">.cgs-breaker[data-state="cgs-open"] .cgs-blade &#123;</text>
    <text x="660" y="595"><tspan fill="#79c0ff">transform</tspan>: <tspan fill="#3fb950">rotate(-35deg)</tspan>; <tspan fill="#79c0ff">stroke</tspan>: <tspan fill="#3fb950">#3fb950</tspan>; <tspan fill="#8b949e">/* Offloaded to GPU */</tspan></text>
    <text x="645" y="607">&#125;</text>
  </g>

  <rect x="635" y="622" width="485" height="36" rx="3" fill="#122619" stroke="#3fb950" stroke-width="1" />
  <text x="645" y="644" font-size="9" font-family="monospace" font-weight="700" fill="#3fb950">&#10003; 0ms Layout Reflow | Rock-Solid 60 FPS under High-Frequency Streams</text>

</svg>
