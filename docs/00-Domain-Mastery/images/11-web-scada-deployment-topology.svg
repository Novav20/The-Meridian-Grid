<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="100%" height="100%" style="background:#16191f; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .title { fill: #f0f6fc; font-size: 17px; font-weight: 700; }
    .subtitle { fill: #8b949e; font-size: 11.5px; }
    .zone-box { fill: #0d1117; stroke: #30363d; stroke-width: 1.2; rx: 6; }
    .node-box { fill: #161b22; stroke: #388bfd; stroke-width: 1.2; rx: 4; }
    .hdr { font-size: 11px; font-weight: 700; }
    .node-hdr { font-size: 9.5px; font-weight: 700; fill: #f0f6fc; }
    .txt-body { font-size: 8.5px; fill: #8b949e; }
    .txt-code { font-family: monospace; font-size: 8px; }
    .tag { font-size: 7.5px; font-weight: 700; text-anchor: middle; }
  </style>

  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="500" y="27" class="title" text-anchor="middle">Decoupled Web SCADA Enterprise Deployment Topology</text>
  <text x="500" y="45" class="subtitle" text-anchor="middle">Purdue Model (ISA-95) &amp; IEC 62443 Zone Segmentation: Dual-NIC Hardware Isolation &amp; IDMZ Reverse Proxy Architecture</text>

  <!-- ================= PURDUE LEVEL 0/1/2: OT FIELD ZONE ================= -->
  <g transform="translate(25, 65)">
    <rect x="0" y="0" width="220" height="450" class="zone-box" stroke="#3fb950" stroke-width="1.2" />
    <text x="14" y="22" class="hdr" fill="#3fb950">Purdue Level 0/1/2: OT Field Zone</text>
    <text x="14" y="35" class="txt-body">Isolated industrial automation network</text>

    <!-- Field Devices Node -->
    <g transform="translate(10, 48)">
      <rect x="0" y="0" width="200" height="150" class="node-box" stroke="#30363d" />
      <text x="10" y="16" class="node-hdr">Physical Automation Equipment</text>
      <text x="10" y="32" class="txt-body">• Modbus RTU / TCP Power Meters</text>
      <text x="10" y="45" class="txt-body">• Siemens S7-1500 / Rockwell PLCs</text>
      <text x="10" y="58" class="txt-body">• Remote I/O Racks (BACnet, PROFINET)</text>
      <text x="10" y="71" class="txt-body">• Smart Coriolis Flow &amp; Temp Transmitters</text>
      <rect x="8" y="85" width="184" height="50" rx="3" fill="#0d1117" stroke="#30363d" />
      <text x="14" y="100" class="txt-code" fill="#7ee787">Subnet: 192.168.1.0/24</text>
      <text x="14" y="114" class="txt-code" fill="#f85149">Default Gateway: NONE (Air-Gapped)</text>
      <text x="14" y="126" class="txt-body">No Internet or Corporate Route Exists</text>
    </g>

    <!-- Dual-Homed EoN Gateway Node -->
    <g transform="translate(10, 215)">
      <rect x="0" y="0" width="200" height="215" class="node-box" stroke="#3fb950" />
      <rect x="0" y="0" width="200" height="22" rx="4" fill="#1b4725" />
      <text x="10" y="15" fill="#3fb950" font-size="9" font-weight="700">«node» Dual-Homed EoN Gateway</text>
      
      <text x="10" y="38" class="txt-body">• Axiomtek iNA300 DIN-rail IPC</text>
      <text x="10" y="51" class="txt-body">• Industrial Linux OS (Kernel 6.x)</text>
      
      <!-- NIC 1 Box -->
      <g transform="translate(8, 60)">
        <rect x="0" y="0" width="184" height="34" rx="2" fill="#0d1117" stroke="#3fb950" />
        <text x="8" y="14" class="txt-code" fill="#7ee787">eth0: 192.168.1.10 (OT LAN)</text>
        <text x="8" y="26" class="txt-body">Polls local fieldbuses &amp; PLC registers</text>
      </g>
      
      <!-- Hardware Air Gap Invariant -->
      <g transform="translate(8, 100)">
        <rect x="0" y="0" width="184" height="32" rx="2" fill="#3b1e22" stroke="#f85149" />
        <text x="92" y="14" fill="#ff7b72" font-size="8" font-weight="700" text-anchor="middle">net.ipv4.ip_forward = 0</text>
        <text x="92" y="24" fill="#ff7b72" font-size="7.5" text-anchor="middle">Hardware Layer 3 Routing Disabled</text>
      </g>

      <!-- NIC 2 Box -->
      <g transform="translate(8, 138)">
        <rect x="0" y="0" width="184" height="34" rx="2" fill="#0d1117" stroke="#388bfd" />
        <text x="8" y="14" class="txt-code" fill="#79c0ff">eth1: 10.10.3.15 (IDMZ Conduit)</text>
        <text x="8" y="26" class="txt-body">Outbound TLS socket to IDMZ broker</text>
      </g>

      <text x="10" y="190" class="txt-body">• Local NVMe Store &amp; Forward Cache</text>
      <text x="10" y="202" class="txt-code" fill="#7ee787">Sparkplug B Protobuf Serializer</text>
    </g>
  </g>

  <!-- ================= FIREWALL 2: OT INNER PERIMETER ================= -->
  <g transform="translate(260, 65)">
    <rect x="0" y="0" width="50" height="450" fill="#2d161a" stroke="#f85149" stroke-width="1.2" rx="4" />
    <text x="25" y="20" fill="#ff7b72" font-size="8.5" font-weight="700" text-anchor="middle">INNER</text>
    <text x="25" y="32" fill="#ff7b72" font-size="8.5" font-weight="700" text-anchor="middle">FIREWALL</text>
    <text x="25" y="44" fill="#ff7b72" font-size="7" text-anchor="middle">(FW 2)</text>
    
    <text x="25" y="220" fill="#f85149" font-size="7.5" font-weight="700" text-anchor="middle" transform="rotate(-90 25 220)">DENY ALL INBOUND</text>
    
    <!-- Conduit arrow across FW 2 -->
    <path d="M -15 365 L 65 365" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arr-green)" />
    <rect x="-3" y="372" width="56" height="15" rx="2" fill="#0d1117" stroke="#3fb950" />
    <text x="25" y="383" fill="#3fb950" font-size="7" font-weight="700" text-anchor="middle">MQTTS :8883</text>
  </g>

  <!-- ================= PURDUE LEVEL 3.5: INDUSTRIAL DMZ (IDMZ) ================= -->
  <g transform="translate(325, 65)">
    <rect x="0" y="0" width="310" height="450" class="zone-box" stroke="#388bfd" stroke-width="1.2" />
    <text x="16" y="22" class="hdr" fill="#58a6ff">Purdue Level 3.5: Industrial DMZ (IDMZ)</text>
    <text x="16" y="35" class="txt-body">High-availability application &amp; message fabric isolation cluster</text>

    <!-- Node: UNS MQTT Broker -->
    <g transform="translate(14, 48)">
      <rect x="0" y="0" width="282" height="115" class="node-box" stroke="#8957e5" />
      <rect x="0" y="0" width="282" height="22" rx="4" fill="#211a36" />
      <text x="10" y="15" fill="#d2a8ff" font-size="9" font-weight="700">«server» Central UNS MQTT Broker Cluster</text>
      <text x="10" y="38" class="txt-body">• EMQX / Mosquitto High-Availability Cluster</text>
      <text x="10" y="51" class="txt-body">• Authoritative Sparkplug B State Machine &amp; Birth Storage</text>
      <text x="10" y="64" class="txt-body">• Non-blocking in-memory topic routing bus</text>
      <text x="10" y="77" class="txt-body">• Complete isolation: zero direct coupling to field PLCs</text>
      <rect x="8" y="86" width="266" height="20" rx="2" fill="#161b22" stroke="#8957e5" />
      <text x="141" y="100" fill="#d2a8ff" font-size="8" font-weight="700" text-anchor="middle">Ingress: TCP :8883 (MQTTS TLS 1.3 mTLS)</text>
    </g>

    <!-- Node: Fastify Web SCADA Gateway -->
    <g transform="translate(14, 175)">
      <rect x="0" y="0" width="282" height="125" class="node-box" />
      <rect x="0" y="0" width="282" height="22" rx="4" fill="#162032" />
      <text x="10" y="15" fill="#58a6ff" font-size="9" font-weight="700">«server» Headless Web SCADA Gateway</text>
      <text x="10" y="38" class="txt-body">• Fastify / uWebSockets.js Streaming Core</text>
      <text x="10" y="51" class="txt-body">• Multiplexes UNS topics to connected browser clients</text>
      <text x="10" y="64" class="txt-body">• JWT Authentication &amp; RBAC Authorization Gateway</text>
      <text x="10" y="77" class="txt-body">• Screen Layout Catalog &amp; Declarative JSON Schemas</text>
      <rect x="8" y="92" width="266" height="22" rx="2" fill="#0d1117" stroke="#388bfd" />
      <text x="141" y="106" fill="#79c0ff" font-size="8" font-weight="700" text-anchor="middle">Exposes: WSS :443 (Live Stream) / HTTPS :443 (UI Assets)</text>
    </g>

    <!-- Node: TimescaleDB Historian -->
    <g transform="translate(14, 312)">
      <rect x="0" y="0" width="282" height="118" class="node-box" />
      <rect x="0" y="0" width="282" height="22" rx="4" fill="#1a2d42" />
      <text x="10" y="15" fill="#f0f6fc" font-size="9" font-weight="700">«database» TimescaleDB Historian Cluster</text>
      <text x="10" y="38" class="txt-body">• Clustered NVMe Storage with Append-Only Hypertables</text>
      <text x="10" y="51" class="txt-body">• Batch Accumulator worker buffering commits (SQL COPY)</text>
      <text x="10" y="64" class="txt-body">• Gorilla XOR &amp; Delta-of-Delta compression (12:1 ratio)</text>
      <text x="10" y="77" class="txt-body">• LTTB Downsampling query proxy</text>
      <rect x="8" y="88" width="266" height="20" rx="2" fill="#161b22" stroke="#30363d" />
      <text x="141" y="102" fill="#8b949e" font-size="7.8" text-anchor="middle">Isolated DB Engine: Zero interference with live WSS stream</text>
    </g>
  </g>

  <!-- ================= FIREWALL 1: OUTER CORPORATE PERIMETER ================= -->
  <g transform="translate(650, 65)">
    <rect x="0" y="0" width="50" height="450" fill="#2d161a" stroke="#f85149" stroke-width="1.2" rx="4" />
    <text x="25" y="20" fill="#ff7b72" font-size="8.5" font-weight="700" text-anchor="middle">OUTER</text>
    <text x="25" y="32" fill="#ff7b72" font-size="8.5" font-weight="700" text-anchor="middle">FIREWALL</text>
    <text x="25" y="44" fill="#ff7b72" font-size="7" text-anchor="middle">(FW 1)</text>
    
    <text x="25" y="220" fill="#f85149" font-size="7.5" font-weight="700" text-anchor="middle" transform="rotate(-90 25 220)">PORT 443 ONLY</text>

    <!-- Conduit arrow across FW 1 -->
    <path d="M 65 240 L -15 240" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arr-blue)" />
    <rect x="-3" y="248" width="56" height="15" rx="2" fill="#0d1117" stroke="#388bfd" />
    <text x="25" y="259" fill="#79c0ff" font-size="7" font-weight="700" text-anchor="middle">WSS / HTTPS :443</text>
  </g>

  <!-- ================= PURDUE LEVEL 4/5: ENTERPRISE & OPERATIONS ================= -->
  <g transform="translate(715, 65)">
    <rect x="0" y="0" width="260" height="450" class="zone-box" stroke="#388bfd" stroke-width="1.2" />
    <text x="14" y="22" class="hdr" fill="#58a6ff">Purdue Level 4/5: Enterprise Clients</text>
    <text x="14" y="35" class="txt-body">Zero-install browser clients &amp; mobile operators</text>

    <!-- Node: Fixed Console Workstation -->
    <g transform="translate(10, 48)">
      <rect x="0" y="0" width="240" height="175" class="node-box" />
      <rect x="0" y="0" width="240" height="22" rx="4" fill="#162032" />
      <text x="10" y="15" fill="#58a6ff" font-size="9" font-weight="700">«workstation» Control Room Consoles</text>
      <text x="10" y="38" class="txt-body">• Tresco Vanguard Sit-Stand Ergonomic Desks</text>
      <text x="10" y="51" class="txt-body">• Multi-Screen 4K Synoptic Mimics (ISA-101)</text>
      <text x="10" y="64" class="txt-body">• Standard Google Chrome / MS Edge browser</text>
      <text x="10" y="77" class="txt-body">• Zero local software, zero DLLs, zero dongles</text>
      <text x="10" y="90" class="txt-body">• Streams live 60 FPS Canvas/SVG telemetry</text>
      <rect x="8" y="105" width="224" height="55" rx="2" fill="#0d1117" stroke="#388bfd" />
      <text x="14" y="120" class="txt-code" fill="#79c0ff">URL: https://scada.meridiangrid.internal</text>
      <text x="14" y="134" class="txt-body">Encrypted WSS :443 WebSocket Stream</text>
      <text x="14" y="146" class="txt-body">Latency: &lt; 25 ms – 50 ms wire-to-screen</text>
    </g>

    <!-- Node: Mobile Field Tablet -->
    <g transform="translate(10, 240)">
      <rect x="0" y="0" width="240" height="190" class="node-box" />
      <rect x="0" y="0" width="240" height="22" rx="4" fill="#162032" />
      <text x="10" y="15" fill="#58a6ff" font-size="9" font-weight="700">«device» Intrinsically Safe Field Tablets</text>
      <text x="10" y="38" class="txt-body">• Getac F110-EX ATEX Zone 2/22 Rugged Tablet</text>
      <text x="10" y="51" class="txt-body">• Cisco IW6300 Industrial Wi-Fi 6 Access Points</text>
      <text x="10" y="64" class="txt-body">• Plant floor mobile operators &amp; technicians</text>
      <text x="10" y="77" class="txt-body">• Identical Web SPA codebase as control room</text>
      <text x="10" y="90" class="txt-body">• Responsive touch-first Level 3 Faceplate modals</text>
      <rect x="8" y="105" width="224" height="70" rx="2" fill="#1b4725" stroke="#2ea043" />
      <text x="14" y="120" fill="#3fb950" font-size="8" font-weight="700">Enterprise Security Guarantees:</text>
      <text x="14" y="132" class="txt-body">• No direct routable IP connection to PLCs</text>
      <text x="14" y="144" class="txt-body">• Compromised tablet CANNOT inject raw packets</text>
      <text x="14" y="156" class="txt-body">• All commands pass IDMZ RBAC &amp; 2-Stage Barrier</text>
      <text x="14" y="168" class="txt-code" fill="#7ee787">100% IEC 62443 Conformance</text>
    </g>
  </g>
</svg>