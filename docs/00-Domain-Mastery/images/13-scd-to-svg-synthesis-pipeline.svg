<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="100%" height="100%" style="background-color: #16191F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#212631" />
      <stop offset="100%" stop-color="#1A1E26" />
    </linearGradient>
    
    <!-- Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#388bfd" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Canvas Background (Opaque #16191F with rx=12) -->
  <rect width="1180" height="700" rx="12" fill="#16191F" />

  <!-- Title & Subtitle -->
  <text x="590" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#f0f6fc">IEC 61850 SCD to Declarative SVG Automated Synthesis Pipeline</text>
  <text x="590" y="60" text-anchor="middle" font-size="12" fill="#8b949e">Programmatic transformation of authoritative substation engineering XML into decoupled SVG synoptics and runtime dynamization maps</text>

  <!-- ==================== STAGE 1: AUTHORITATIVE SCL INGESTION ==================== -->
  <rect x="35" y="80" width="345" height="595" rx="8" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1" />
  
  <rect x="50" y="92" width="220" height="22" rx="4" fill="#16191F" stroke="#388bfd" stroke-width="1" />
  <circle cx="62" cy="103" r="4" fill="#388bfd" />
  <text x="74" y="107" font-size="11" font-weight="700" fill="#79c0ff">1. Authoritative SCL Source</text>
  <text x="50" y="132" font-size="10" fill="#8b949e">Single Source of Truth: Substation Configuration XML</text>

  <!-- SCD Code Box -->
  <rect x="48" y="145" width="319" height="345" rx="6" fill="#0d1117" stroke="#30363D" stroke-width="1" />
  <rect x="48" y="145" width="319" height="24" rx="6" fill="#16191F" />
  <text x="58" y="161" font-size="9.5" font-family="monospace" font-weight="700" fill="#c9d1d9">Substation_Alpha.scd (XML AST)</text>

  <g xml:space="preserve" font-family="monospace" font-size="9.5" line-height="1.5">
    <text x="58" y="190" fill="#8b949e">&lt;<tspan fill="#79c0ff">SCL</tspan> xmlns=".../61850"&gt;</text>
    <text x="68" y="210" fill="#8b949e">&lt;<tspan fill="#79c0ff">Substation</tspan> <tspan fill="#d2a8ff">name</tspan>=<tspan fill="#a5d6ff">"Alpha"</tspan>&gt;</text>
    <text x="78" y="230" fill="#8b949e">&lt;<tspan fill="#79c0ff">VoltageLevel</tspan> <tspan fill="#d2a8ff">val</tspan>=<tspan fill="#a5d6ff">"110"</tspan>&gt;</text>
    <text x="88" y="250" fill="#8b949e">&lt;<tspan fill="#79c0ff">Bay</tspan> <tspan fill="#d2a8ff">name</tspan>=<tspan fill="#a5d6ff">"Bay01"</tspan>&gt;</text>
    <text x="98" y="270" fill="#8b949e">&lt;<tspan fill="#79c0ff">ConductingEquipment</tspan></text>
    <text x="110" y="290" fill="#8b949e"><tspan fill="#d2a8ff">name</tspan>=<tspan fill="#a5d6ff">"QA1"</tspan> <tspan fill="#d2a8ff">type</tspan>=<tspan fill="#f85149">"CBR"</tspan>&gt;</text>
    <text x="110" y="310" fill="#8b949e">&lt;<tspan fill="#79c0ff">Terminal</tspan> <tspan fill="#d2a8ff">cNode</tspan>=<tspan fill="#a5d6ff">"CN_BusA"</tspan>/&gt;</text>
    <text x="110" y="330" fill="#8b949e">&lt;<tspan fill="#79c0ff">Terminal</tspan> <tspan fill="#d2a8ff">cNode</tspan>=<tspan fill="#a5d6ff">"CN_Feeder1"</tspan>/&gt;</text>
    <text x="110" y="350" fill="#8b949e">&lt;<tspan fill="#79c0ff">LNode</tspan> <tspan fill="#d2a8ff">lnClass</tspan>=<tspan fill="#3fb950">"XCBR"</tspan></text>
    <text x="122" y="370" fill="#8b949e"><tspan fill="#d2a8ff">lnInst</tspan>=<tspan fill="#a5d6ff">"1"</tspan> <tspan fill="#d2a8ff">iedName</tspan>=<tspan fill="#a5d6ff">"IED_Alpha01"</tspan>/&gt;</text>
    <text x="98" y="390" fill="#8b949e">&lt;/<tspan fill="#79c0ff">ConductingEquipment</tspan>&gt;</text>
    <text x="88" y="410" fill="#8b949e">&lt;/<tspan fill="#79c0ff">Bay</tspan>&gt;</text>
    <text x="78" y="430" fill="#8b949e">&lt;/<tspan fill="#79c0ff">VoltageLevel</tspan>&gt;</text>
    <text x="68" y="450" fill="#8b949e">&lt;/<tspan fill="#79c0ff">Substation</tspan>&gt;</text>
    <text x="58" y="470" fill="#8b949e">&lt;/<tspan fill="#79c0ff">SCL</tspan>&gt;</text>
  </g>

  <!-- Safety Card Bottom Left -->
  <rect x="48" y="505" width="319" height="155" rx="6" fill="#16191F" stroke="#3fb950" stroke-width="1" />
  <text x="60" y="525" font-size="10.5" font-weight="700" fill="#3fb950">&#10003; Safety Invariants (Zero CAD Errors):</text>
  <text x="60" y="545" font-size="9" fill="#c9d1d9">&#8226; Eliminates manual drag-and-drop drafting</text>
  <text x="60" y="562" font-size="9" fill="#c9d1d9">&#8226; Eliminates tag transposition errors</text>
  <text x="60" y="579" font-size="9" fill="#c9d1d9">&#8226; Prevents false "Open" arc-flash explosions</text>
  <text x="60" y="596" font-size="9" fill="#c9d1d9">&#8226; 100% mathematically verified topology</text>
  <rect x="58" y="612" width="299" height="34" rx="3" fill="#122619" />
  <text x="68" y="632" font-size="8.5" font-family="monospace" fill="#3fb950">Ground Truth: Electrical SCD XML</text>

  <!-- Flow Arrow from Stage 1 to Stage 2 -->
  <path d="M 380 375 L 415 375" fill="none" stroke="#388bfd" stroke-width="2" marker-end="url(#arrowBlue)" />

  <!-- ==================== STAGE 2: AUTOMATED TOPOLOGY COMPILER ==================== -->
  <rect x="420" y="80" width="340" height="595" rx="8" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1" />
  
  <rect x="435" y="92" width="220" height="22" rx="4" fill="#16191F" stroke="#388bfd" stroke-width="1" />
  <circle cx="447" cy="103" r="4" fill="#388bfd" />
  <text x="459" y="107" font-size="11" font-weight="700" fill="#79c0ff">2. Synthesis &amp; Graph Engine</text>
  <text x="435" y="132" font-size="10" fill="#8b949e">Topology Parser, Router &amp; CGS Resolver</text>

  <!-- Module A: Planar Graph Router -->
  <rect x="435" y="145" width="310" height="150" rx="6" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <rect x="445" y="155" width="190" height="18" rx="2" fill="#122638" />
  <text x="450" y="168" font-size="9.5" font-weight="700" fill="#79c0ff">A. Topological Planar Router</text>
  <text x="445" y="190" font-size="9" fill="#c9d1d9">&#8226; Traces &lt;ConnectivityNode&gt; meshes</text>
  <text x="445" y="206" font-size="9" fill="#c9d1d9">&#8226; Resolves dual-busbar trajectories (W1/W2)</text>
  <text x="445" y="222" font-size="9" fill="#c9d1d9">&#8226; Generates non-overlapping orthogonal paths</text>
  <text x="445" y="238" font-size="9" fill="#c9d1d9">&#8226; Computes symmetrical bay X/Y layout</text>
  <rect x="445" y="252" width="290" height="30" rx="3" fill="#0d1117" stroke="#30363D" stroke-width="1" />
  <text x="453" y="271" font-size="8.5" font-family="monospace" fill="#3fb950">&#10003; 0 Diagonal Line Collisions</text>

  <!-- Module B: CGS Symbol Glyph Resolver -->
  <rect x="435" y="305" width="310" height="140" rx="6" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <rect x="445" y="315" width="200" height="18" rx="2" fill="#122638" />
  <text x="450" y="328" font-size="9.5" font-weight="700" fill="#79c0ff">B. CGS Glyph Resolution</text>
  <text x="445" y="350" font-size="9" fill="#c9d1d9">&#8226; Maps IEC 61850-7-4 equipment types:</text>
  <text x="455" y="367" font-size="8.5" font-family="monospace" fill="#f85149">type="CBR" &#8594; #cgs-breaker</text>
  <text x="455" y="382" font-size="8.5" font-family="monospace" fill="#79c0ff">type="DIS" &#8594; #cgs-disconnector</text>
  <text x="455" y="397" font-size="8.5" font-family="monospace" fill="#3fb950">type="PTR" &#8594; #cgs-transformer</text>
  <text x="445" y="420" font-size="8.5" fill="#8b949e">&#8226; Standardized vector glyphs placed in &lt;defs&gt;</text>
  <text x="445" y="434" font-size="8.5" font-weight="600" fill="#3fb950">&#10003; IEC 61850-7-4 Compliant Symbols</text>

  <!-- Module C: Deterministic Compound ID Rule -->
  <rect x="435" y="455" width="310" height="205" rx="6" fill="#16191F" stroke="#388bfd" stroke-width="1" />
  <rect x="445" y="465" width="245" height="18" rx="2" fill="#122638" />
  <text x="450" y="478" font-size="9.5" font-weight="700" fill="#79c0ff">C. Deterministic Compound ID Rule</text>
  <text x="445" y="500" font-size="8.5" font-family="monospace" fill="#8b949e">${Sub}_${Volt}_${Bay}_${Eq}_${LN}</text>
  
  <rect x="445" y="512" width="290" height="34" rx="4" fill="#0d1117" stroke="#388bfd" stroke-width="1" />
  <text x="452" y="533" font-size="9" font-family="monospace" font-weight="700" fill="#79c0ff">Alpha_110kV_Bay01_QA1_XCBR1</text>

  <text x="445" y="565" font-size="9" fill="#c9d1d9">&#8226; Guarantees zero DOM selector collisions</text>
  <text x="445" y="582" font-size="9" fill="#c9d1d9">&#8226; 1:1 match with MQTT UNS topic structure</text>
  <text x="445" y="599" font-size="9" fill="#c9d1d9">&#8226; Enables O(1) document.getElementById lookup</text>
  <rect x="445" y="614" width="290" height="32" rx="3" fill="#122638" />
  <text x="453" y="634" font-size="8.5" font-family="monospace" fill="#79c0ff">&#10003; Traceable: Dobrokhotov et al., 2025</text>

  <!-- Flow Arrow from Stage 2 to Stage 3 -->
  <path d="M 760 375 L 795 375" fill="none" stroke="#388bfd" stroke-width="2" marker-end="url(#arrowBlue)" />

  <!-- ==================== STAGE 3: DUAL-FILE OUTPUT GENERATION ==================== -->
  <rect x="800" y="80" width="345" height="595" rx="8" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1" />
  
  <rect x="815" y="92" width="230" height="22" rx="4" fill="#16191F" stroke="#3fb950" stroke-width="1" />
  <circle cx="827" cy="103" r="4" fill="#3fb950" />
  <text x="839" y="107" font-size="11" font-weight="700" fill="#3fb950">3. Decoupled Dual-File Output</text>
  <text x="815" y="132" font-size="10" fill="#8b949e">SyTrack Pattern: Vector Layout &amp; Signal Decoupling</text>

  <!-- Output File 1: SVG Vector Mnemonic -->
  <rect x="815" y="145" width="315" height="225" rx="6" fill="#0d1117" stroke="#30363D" stroke-width="1" />
  <rect x="815" y="145" width="315" height="24" rx="6" fill="#16191F" />
  <text x="825" y="161" font-size="9.5" font-family="monospace" font-weight="700" fill="#79c0ff">FILE 1: Substation_Alpha_SLD.svg</text>

  <g xml:space="preserve" font-family="monospace" font-size="8.5">
    <text x="825" y="185" fill="#8b949e">&lt;<tspan fill="#79c0ff">svg</tspan> viewBox="0 0 1920 1080"&gt;</text>
    <text x="835" y="202" fill="#8b949e">&lt;<tspan fill="#79c0ff">defs</tspan>&gt; ...Master Glyphs... &lt;/<tspan fill="#79c0ff">defs</tspan>&gt;</text>
    <text x="835" y="222" fill="#8b949e">&lt;<tspan fill="#79c0ff">path</tspan> <tspan fill="#d2a8ff">class</tspan>=<tspan fill="#a5d6ff">"busbar-110kv"</tspan> <tspan fill="#d2a8ff">d</tspan>=<tspan fill="#a5d6ff">"..."</tspan>/&gt;</text>
    <text x="835" y="242" fill="#8b949e">&lt;<tspan fill="#79c0ff">use</tspan> <tspan fill="#d2a8ff">href</tspan>=<tspan fill="#a5d6ff">"#cgs-breaker"</tspan></text>
    <text x="845" y="259" fill="#8b949e"><tspan fill="#d2a8ff">id</tspan>=<tspan fill="#79c0ff">"Alpha_110kV_Bay01_QA1_XCBR1"</tspan></text>
    <text x="845" y="276" fill="#8b949e"><tspan fill="#d2a8ff">x</tspan>=<tspan fill="#a5d6ff">"450"</tspan> <tspan fill="#d2a8ff">y</tspan>=<tspan fill="#a5d6ff">"320"</tspan></text>
    <text x="845" y="293" fill="#8b949e"><tspan fill="#d2a8ff">class</tspan>=<tspan fill="#f85149">"state-closed"</tspan></text>
    <text x="845" y="310" fill="#8b949e"><tspan fill="#d2a8ff">data-topic</tspan>=<tspan fill="#a5d6ff">".../QA1/XCBR1/Pos"</tspan>/&gt;</text>
    <text x="825" y="332" fill="#8b949e">&lt;/<tspan fill="#79c0ff">svg</tspan>&gt;</text>
  </g>
  <text x="825" y="358" font-size="8.5" fill="#3fb950">&#10003; Pure vector geometry; 0 hardcoded signal logic</text>

  <!-- Output File 2: Dynamization Mapping Specification -->
  <rect x="815" y="380" width="315" height="180" rx="6" fill="#0d1117" stroke="#30363D" stroke-width="1" />
  <rect x="815" y="380" width="315" height="24" rx="6" fill="#16191F" />
  <text x="825" y="396" font-size="9.5" font-family="monospace" font-weight="700" fill="#3fb950">FILE 2: Substation_Alpha_Map.json</text>

  <g xml:space="preserve" font-family="monospace" font-size="8">
    <text x="825" y="420" fill="#c9d1d9">&#123;</text>
    <text x="835" y="435" fill="#79c0ff">"elementId"<tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"Alpha_110kV_Bay01_QA1_XCBR1"</tspan><tspan fill="#c9d1d9">,</tspan></text>
    <text x="835" y="450" fill="#79c0ff">"unsTopic"<tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"Enterprise/Alpha/110kV/Bay01/QA1/Pos"</tspan><tspan fill="#c9d1d9">,</tspan></text>
    <text x="835" y="465" fill="#79c0ff">"property"<tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"data-state"</tspan><tspan fill="#c9d1d9">,</tspan></text>
    <text x="835" y="480" fill="#79c0ff">"states"<tspan fill="#c9d1d9">: &#123; </tspan><tspan fill="#a5d6ff">"1"</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#3fb950">"open"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"2"</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#f85149">"closed"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"3"</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#ff7b72">"fault"</tspan><tspan fill="#c9d1d9"> &#125;</tspan></text>
    <text x="825" y="495" fill="#c9d1d9">&#125;</text>
  </g>
  <text x="825" y="525" font-size="8.5" fill="#8b949e">&#8226; Ingested by WebSocket client at runtime</text>
  <text x="825" y="542" font-size="8.5" fill="#8b949e">&#8226; Direct binding from live broker deltas to DOM</text>

  <!-- Decoupled Lifecycle Box -->
  <rect x="815" y="570" width="315" height="90" rx="6" fill="#16191F" stroke="#3fb950" stroke-width="1" />
  <text x="825" y="590" font-size="10" font-weight="700" fill="#3fb950">&#10003; Decoupled Lifecycle Advantage:</text>
  <text x="825" y="608" font-size="8.5" fill="#c9d1d9">Modify telemetry topic paths or IED IP addresses without</text>
  <text x="825" y="622" font-size="8.5" fill="#c9d1d9">re-drawing or re-compiling SVG vector coordinates.</text>
  <text x="825" y="642" font-size="8.5" font-family="monospace" fill="#79c0ff">&#10003; Independent Graphic &amp; Logic Versioning</text>

</svg>
