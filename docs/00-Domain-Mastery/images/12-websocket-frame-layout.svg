<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="1240" height="860" preserveAspectRatio="xMidYMin meet" style="background:#16191F; font-family: Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#388bfd" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b72" />
    </marker>
  </defs>
  <rect width="1240" height="860" rx="12" fill="#16191F" stroke="#30363D" stroke-width="1.5" class="bg" />
  <text x="620" y="36" fill="#F0F6FC" font-size="19" font-weight="700" text-anchor="middle">RFC 6455 Binary Frame Architecture &amp; Industrial Payloads</text>
  <text x="620" y="58" fill="#8B949E" font-size="12" text-anchor="middle">Fixed 16-bit base header, optional length fields, and the payload masking path</text>
  <rect x="30" y="82" width="1180" height="270" rx="8" fill="#1E222B" stroke="#30363D" stroke-width="1.2" />
  <rect x="46" y="96" width="340" height="26" rx="4" fill="#16191F" stroke="#388bfd" stroke-width="1.2" />
  <text x="54" y="113" fill="#79c0ff" font-size="11" font-weight="700">1. RFC 6455 BIT-LEVEL SPECIFICATION GRID</text>
  <text x="400" y="113" fill="#8B949E" font-size="10.5">The first two bytes are always a fixed 16-bit base header</text>
  <rect x="50" y="130" width="568" height="20" rx="3" fill="#0D1117" stroke="#30363D" stroke-width="0.8" />
  <text x="53" y="144" fill="#8B949E" font-size="8.5" font-family="monospace">b0</text>
  <text x="88" y="144" fill="#8B949E" font-size="8.5" font-family="monospace">b1</text>
  <text x="195" y="144" fill="#8B949E" font-size="8.5" font-family="monospace">b4</text>
  <text x="338" y="144" fill="#8B949E" font-size="8.5" font-family="monospace">b8</text>
  <text x="373" y="144" fill="#8B949E" font-size="8.5" font-family="monospace">b9</text>
  <text x="587" y="144" fill="#8B949E" font-size="8.5" font-family="monospace">b15</text>
  <rect x="50" y="154" width="568" height="42" rx="4" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <rect x="50" y="154" width="35" height="42" fill="#0D1B2A" stroke="#388bfd" stroke-width="0.8" />
  <text x="67" y="178" fill="#79c0ff" font-size="8.5" font-weight="700" text-anchor="middle">FIN</text>
  <rect x="85" y="154" width="106" height="42" fill="#16191F" stroke="#30363D" stroke-width="0.8" />
  <text x="138" y="178" fill="#8B949E" font-size="8.5" text-anchor="middle">RSV 1-3</text>
  <rect x="191" y="154" width="142" height="42" fill="#0D1B2A" stroke="#388bfd" stroke-width="0.8" />
  <text x="262" y="174" fill="#79c0ff" font-size="8.5" font-weight="700" text-anchor="middle">Opcode</text>
  <text x="262" y="186" fill="#C9D1D9" font-size="7.5" text-anchor="middle">(4 Bits)</text>
  <rect x="333" y="154" width="35" height="42" fill="#2C1517" stroke="#ff7b72" stroke-width="0.8" />
  <text x="350" y="178" fill="#ff7b72" font-size="8" font-weight="700" text-anchor="middle">M</text>
  <rect x="368" y="154" width="249" height="42" fill="#0D1B2A" stroke="#388bfd" stroke-width="0.8" />
  <text x="492" y="174" fill="#79c0ff" font-size="8.5" font-weight="700" text-anchor="middle">Payload Length</text>
  <text x="492" y="186" fill="#C9D1D9" font-size="7.5" text-anchor="middle">(7 Bits: 0–125 / 126 / 127)</text>
  <rect x="650" y="154" width="540" height="42" rx="4" fill="#16191F" stroke="#30363D" stroke-width="0.8" />
  <text x="920" y="174" fill="#79c0ff" font-size="9" font-weight="700" text-anchor="middle">FIXED BASE HEADER = 16 BITS</text>
  <text x="920" y="186" fill="#8B949E" font-size="7.5" text-anchor="middle">The optional fields below are not part of this fixed header.</text>
  <rect x="50" y="202" width="1140" height="42" rx="4" fill="#0D1B2A" stroke="#388bfd" stroke-width="0.8" />
  <text x="620" y="222" fill="#79c0ff" font-size="8.8" font-weight="700" text-anchor="middle">OPTIONAL EXTENDED PAYLOAD LENGTH</text>
  <text x="620" y="234" fill="#C9D1D9" font-size="7.5" text-anchor="middle">Base length = 126 → next 16 bits (2 bytes) | Base length = 127 → next 64 bits (8 bytes; unsigned)</text>
  <rect x="50" y="250" width="1140" height="42" rx="4" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <rect x="50" y="250" width="427" height="42" fill="#2C1517" stroke="#ff7b72" stroke-width="0.8" />
  <text x="263" y="270" fill="#ff7b72" font-size="8.5" font-weight="700" text-anchor="middle">MASKING KEY (32 bits / 4 bytes)</text>
  <text x="263" y="282" fill="#FFA198" font-size="7.5" text-anchor="middle">Only present when MASK = 1 (client-to-server)</text>
  <rect x="477" y="250" width="713" height="42" fill="#14261C" stroke="#3fb950" stroke-width="0.8" />
  <text x="833" y="270" fill="#3fb950" font-size="8.8" font-weight="700" text-anchor="middle">PAYLOAD DATA: each byte is transformed when MASK = 1</text>
  <text x="833" y="282" fill="#C9D1D9" font-size="7.5" text-anchor="middle">wire byte Pᵢ ⊕ Kᵢ mod 4 → receiver reverses the same XOR to recover Pᵢ</text>
  <path d="M 263 292 L 263 311 L 833 311 L 833 292" fill="none" stroke="#ff7b72" stroke-width="1.5" marker-end="url(#arr-red)" />
  <text x="548" y="326" fill="#FFA198" font-size="8.5" text-anchor="middle">The 4-byte key is not payload data: it selects the repeating XOR byte applied to every payload byte.</text>
  <text x="60" y="343" fill="#79c0ff" font-size="9" font-weight="700">Header rule:</text>
  <text x="125" y="343" fill="#C9D1D9" font-size="9">The fixed header is 16 bits; extended length, masking key, and payload follow conditionally.</text>
  <g transform="translate(0,75)">
  <rect x="30" y="295" width="575" height="420" rx="8" fill="#1E222B" stroke="#30363D" stroke-width="1.2" />
  <rect x="46" y="309" width="360" height="26" rx="4" fill="#16191F" stroke="#3fb950" stroke-width="1.2" />
  <text x="54" y="326" fill="#3fb950" font-size="11" font-weight="700">2. CONCRETE SERVER PUSH: SPARKPLUG B DDATA</text>
  <text x="420" y="326" fill="#8B949E" font-size="10.5">Opcode 0x2 (Unmasked)</text>
  <rect x="46" y="347" width="543" height="70" rx="6" fill="#0D1117" stroke="#3fb950" stroke-width="1" />
  <text x="56" y="369" fill="#79c0ff" font-size="9" font-weight="700">RAW ON-THE-WIRE HEXADECIMAL STREAM (Reboiler Level LT-102 = 82.4%):</text>
  <text x="56" y="389" fill="#3fb950" font-size="12" font-family="monospace" font-weight="700">0x82 0x14 <tspan fill="#C9D1D9">0x08 0x66 0x10 0x01 0x1D 0xCD 0xCC 0xA4 0x42 ...</tspan></text>
  <text x="56" y="405" fill="#8B949E" font-size="8.5">Byte 0: Header | Byte 1: Len | Bytes 2..21: Sparkplug B Protobuf Payload (20 Bytes)</text>
  <rect x="46" y="427" width="543" height="175" rx="6" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <line x1="46" y1="443" x2="589" y2="443" stroke="#21262D" stroke-width="0.8" />
  <text x="56" y="457" fill="#3fb950" font-size="9" font-family="monospace" font-weight="700">Byte 0: 0x82</text>
  <text x="155" y="457" fill="#8B949E" font-size="8.5" font-family="monospace">1000 0010</text>
  <text x="255" y="457" fill="#C9D1D9" font-size="8.5">FIN=1 (Final Frame) | RSV=000 | Opcode=0x2 (Binary Frame)</text>
  <line x1="46" y1="477" x2="589" y2="477" stroke="#21262D" stroke-width="0.8" />
  <text x="56" y="491" fill="#3fb950" font-size="9" font-family="monospace" font-weight="700">Byte 1: 0x14</text>
  <text x="155" y="491" fill="#8B949E" font-size="8.5" font-family="monospace">0001 0100</text>
  <text x="255" y="491" fill="#C9D1D9" font-size="8.5">MASK=0 (Unmasked Server Push) | Length = 20 Bytes</text>
  <line x1="46" y1="511" x2="589" y2="511" stroke="#21262D" stroke-width="0.8" />
  <text x="56" y="525" fill="#79c0ff" font-size="9" font-family="monospace" font-weight="700">Bytes 2–5</text>
  <text x="155" y="525" fill="#8B949E" font-size="8.5" font-family="monospace">Protobuf Tags</text>
  <text x="255" y="525" fill="#C9D1D9" font-size="8.5">Field 1: Tag ID = 102 (varint 0x66)</text>
  <line x1="46" y1="545" x2="589" y2="545" stroke="#21262D" stroke-width="0.8" />
  <text x="56" y="559" fill="#79c0ff" font-size="9" font-family="monospace" font-weight="700">Bytes 6–9</text>
  <text x="155" y="559" fill="#8B949E" font-size="8.5" font-family="monospace">Protobuf Val</text>
  <text x="255" y="559" fill="#C9D1D9" font-size="8.5">Field 2: Float Value = 82.4% (IEEE 754 0x42A4CCCD)</text>
  <line x1="46" y1="579" x2="589" y2="579" stroke="#21262D" stroke-width="0.8" />
  <text x="56" y="593" fill="#c9d1d9" font-size="9" font-family="monospace" font-weight="700">Bytes 10–21</text>
  <text x="155" y="593" fill="#8B949E" font-size="8.5" font-family="monospace">Quality &amp; SOE</text>
  <text x="255" y="593" fill="#C9D1D9" font-size="8.5">Timestamp = 1792350000ms | Quality = GOOD (192)</text>
  <rect x="46" y="612" width="543" height="85" rx="6" fill="#16191F" stroke="#388bfd" stroke-width="1" />
  <text x="56" y="632" fill="#79c0ff" font-size="10" font-weight="700">Browser V8 Optimization Invariants (Lesson 14 &amp; 15):</text>
  <text x="56" y="650" fill="#C9D1D9" font-size="9">• <tspan fill="#3fb950" font-weight="700">Zero UTF-8 Validation:</tspan> Opcode 0x2 binary frames bypass string validation.</text>
  <text x="56" y="664" fill="#C9D1D9" font-size="9">• <tspan fill="#3fb950" font-weight="700">Zero-Copy Web Worker Dispatch:</tspan> Ingests directly into <tspan font-family="monospace" fill="#79c0ff">ArrayBuffer</tspan> and</text>
  <text x="56" y="678" fill="#C9D1D9" font-size="9">  transfers to background worker thread via <tspan font-family="monospace" fill="#79c0ff">postMessage([buffer], [buffer])</tspan>.</text>
  <rect x="635" y="295" width="575" height="420" rx="8" fill="#1E222B" stroke="#30363D" stroke-width="1.2" />
  <rect x="651" y="309" width="380" height="26" rx="4" fill="#16191F" stroke="#ff7b72" stroke-width="1.2" />
  <text x="659" y="326" fill="#ff7b72" font-size="11" font-weight="700">3. CONCRETE CLIENT CONTROL: SETPOINT DISPATCH</text>
  <text x="1045" y="326" fill="#8B949E" font-size="10.5">Opcode 0x2 (Masked)</text>
  <rect x="651" y="347" width="543" height="70" rx="6" fill="#0D1117" stroke="#ff7b72" stroke-width="1" />
  <text x="661" y="369" fill="#79c0ff" font-size="9" font-weight="700">RAW ON-THE-WIRE HEXADECIMAL STREAM (Adjust Valve FV-108 Setpoint SP = 65.0%):</text>
  <text x="661" y="389" fill="#ff7b72" font-size="12" font-family="monospace" font-weight="700">0x82 0x88 <tspan fill="#e3b341">0x3F 0x9A 0x12 0x55</tspan> <tspan fill="#C9D1D9">0x7B 0xFE 0x94 0x11 ...</tspan></text>
  <text x="661" y="405" fill="#8B949E" font-size="8.5">Byte 0: Header | Byte 1: Mask+Len | Bytes 2–5: XOR Key | Bytes 6–13: Masked Data</text>
  <rect x="651" y="427" width="543" height="175" rx="6" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <line x1="651" y1="443" x2="1194" y2="443" stroke="#21262D" stroke-width="0.8" />
  <text x="661" y="457" fill="#3fb950" font-size="9" font-family="monospace" font-weight="700">Byte 0: 0x82</text>
  <text x="760" y="457" fill="#8B949E" font-size="8.5" font-family="monospace">1000 0010</text>
  <text x="880" y="457" fill="#C9D1D9" font-size="8.5">FIN=1 (Final Frame) | RSV=000 | Opcode=0x2 (Binary Command)</text>
  <line x1="651" y1="477" x2="1194" y2="477" stroke="#21262D" stroke-width="0.8" />
  <text x="661" y="491" fill="#ff7b72" font-size="9" font-family="monospace" font-weight="700">Byte 1: 0x88</text>
  <text x="760" y="491" fill="#8B949E" font-size="8.5" font-family="monospace">1000 1000</text>
  <text x="880" y="491" fill="#C9D1D9" font-size="8.5">MASK=1 (Mandatory Client Mask) | Length = 8 Bytes</text>
  <line x1="651" y1="511" x2="1194" y2="511" stroke="#21262D" stroke-width="0.8" />
  <text x="661" y="525" fill="#e3b341" font-size="9" font-family="monospace" font-weight="700">Bytes 2–5</text>
  <text x="760" y="525" fill="#8B949E" font-size="8.5" font-family="monospace">0x3F 0x9A 0x12 0x55</text>
  <text x="880" y="525" fill="#C9D1D9" font-size="8.5">Random 4-Byte XOR Masking Key generated by browser</text>
  <line x1="651" y1="545" x2="1194" y2="545" stroke="#21262D" stroke-width="0.8" />
  <text x="661" y="559" fill="#79c0ff" font-size="9" font-family="monospace" font-weight="700">Bytes 6–9</text>
  <text x="760" y="559" fill="#8B949E" font-size="8.5" font-family="monospace">Masked Val</text>
  <text x="880" y="559" fill="#C9D1D9" font-size="8.5">Target Valve: FV-108 (XOR Masked in browser)</text>
  <line x1="651" y1="579" x2="1194" y2="579" stroke="#21262D" stroke-width="0.8" />
  <text x="661" y="593" fill="#c9d1d9" font-size="9" font-family="monospace" font-weight="700">Bytes 10–13</text>
  <text x="760" y="593" fill="#8B949E" font-size="8.5" font-family="monospace">Masked SP</text>
  <text x="880" y="593" fill="#C9D1D9" font-size="8.5">New Target Setpoint: SP = 65.0% (IEEE 754 Float XORed)</text>
  <rect x="651" y="612" width="543" height="85" rx="6" fill="#16191F" stroke="#ff7b72" stroke-width="1" />
  <text x="661" y="632" fill="#ff7b72" font-size="10" font-weight="700">Security Invariant: Proxy Cache Poisoning Defense:</text>
  <text x="661" y="650" fill="#C9D1D9" font-size="9">• <tspan fill="#ff7b72" font-weight="700">Mandatory Client Masking:</tspan> Prevents malicious browser scripts from forging</text>
  <text x="661" y="664" fill="#C9D1D9" font-size="9">  predictable HTTP responses on the wire to poison intermediate caching proxies.</text>
  <text x="661" y="678" fill="#C9D1D9" font-size="9">• <tspan fill="#3fb950" font-weight="700">Gateway Demasking:</tspan> Gateway unmasks in <tspan font-family="monospace" fill="#79c0ff">C++</tspan>: P<tspan baseline-shift="sub" font-size="7">i</tspan> = M<tspan baseline-shift="sub" font-size="7">i</tspan> &#x2295; K<tspan baseline-shift="sub" font-size="7">i mod 4</tspan>.</text>
  </g>
  <rect x="30" y="814" width="1180" height="32" rx="6" fill="#1E222B" stroke="#30363D" stroke-width="1" />
  <text x="45" y="834" fill="#3fb950" font-size="10" font-weight="700">✓ Server-to-client: 2-byte base overhead</text>
  <text x="300" y="834" fill="#8B949E" font-size="9.5">plus optional extended length when payload is ≥126 bytes</text>
  <text x="760" y="834" fill="#ff7b72" font-size="10" font-weight="700">✗ Client-to-server: add 4-byte key when MASK=1</text>
  <text x="1090" y="834" fill="#8B949E" font-size="9.5">key XORs all payload bytes</text>
</svg>