<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" style="background:#16191f; font-family:Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="960" height="520" rx="10" fill="#16191f" stroke="#30363d"/>
  <text x="500" y="52" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700">Hybrid Viewport: Three Responsibilities, One Screen</text>
  <text x="500" y="76" text-anchor="middle" fill="#8b949e" font-size="12">The stack separates structure, fast-changing telemetry, and operator interaction</text>

  <rect x="90" y="112" width="820" height="90" rx="6" fill="#0d1117" stroke="#388bfd" stroke-width="1.5"/>
  <text x="120" y="140" fill="#79c0ff" font-size="15" font-weight="700">DOM HUD and modals</text>
  <text x="120" y="162" fill="#c9d1d9" font-size="11">Focus, keyboard navigation, alarms, forms, and confirmation</text>
  <text x="760" y="150" text-anchor="middle" fill="#79c0ff" font-size="11" font-weight="700">INTERACTION OWNER</text>
  <text x="760" y="170" text-anchor="middle" fill="#8b949e" font-size="10">receives pointer and focus</text>

  <rect x="90" y="220" width="820" height="90" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1.5"/>
  <text x="120" y="248" fill="#d29922" font-size="15" font-weight="700">Canvas / WebGL telemetry overlay</text>
  <text x="120" y="270" fill="#c9d1d9" font-size="11">Dense traces, particles, and other high-frequency pixels</text>
  <text x="760" y="258" text-anchor="middle" fill="#d29922" font-size="11" font-weight="700">UPDATE OWNER</text>
  <text x="760" y="278" text-anchor="middle" fill="#8b949e" font-size="10">does not own clicks</text>

  <rect x="90" y="328" width="820" height="90" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
  <text x="120" y="356" fill="#3fb950" font-size="15" font-weight="700">Retained SVG synoptic</text>
  <text x="120" y="378" fill="#c9d1d9" font-size="11">Stable plant structure, symbols, and equipment hit targets</text>
  <text x="760" y="366" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="700">STRUCTURE OWNER</text>
  <text x="760" y="386" text-anchor="middle" fill="#8b949e" font-size="10">receives pass-through clicks</text>

  <path d="M 500 202 L 500 220" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 500 310 L 500 328" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="214" text-anchor="middle" fill="#8b949e" font-size="10">visual stacking</text>
  <text x="500" y="322" text-anchor="middle" fill="#8b949e" font-size="10">pointer-events: none on overlay</text>

  <rect x="90" y="448" width="820" height="56" rx="6" fill="#1e222b" stroke="#30363d"/>
  <text x="500" y="472" text-anchor="middle" fill="#f0f6fc" font-size="12" font-weight="700">Teaching point: layer ownership prevents one rendering mode from carrying every responsibility.</text>
  <text x="500" y="490" text-anchor="middle" fill="#8b949e" font-size="10">The stack is a coordination boundary, not a list of interchangeable drawing APIs.</text>
</svg>
