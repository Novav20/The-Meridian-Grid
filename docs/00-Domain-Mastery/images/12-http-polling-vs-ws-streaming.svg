<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="100%" height="100%" style="background:#16191F; font-family: Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#388bfd" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b72" />
    </marker>
  </defs>
  <rect width="1240" height="780" rx="12" fill="#16191F" stroke="#30363D" stroke-width="1.5" class="bg" />
  <text x="620" y="36" fill="#F0F6FC" font-size="19" font-weight="700" text-anchor="middle">Network Wire Traffic: HTTP/1.1 Short Polling vs. WebSocket Streaming</text>
  <text x="620" y="58" fill="#8B949E" font-size="12" text-anchor="middle">Concrete Wire Trace Comparison for Reboiler Temperature Transmitter TI-102 (100 Hz Telemetry Stream)</text>
  <rect x="30" y="82" width="575" height="635" rx="8" fill="#1E222B" stroke="#30363D" stroke-width="1.2" />
  <rect x="46" y="96" width="320" height="26" rx="4" fill="#16191F" stroke="#ff7b72" stroke-width="1.2" />
  <text x="54" y="113" fill="#ff7b72" font-size="11" font-weight="700">1. HTTP/1.1 SHORT POLLING (THE HEADER TAX)</text>
  <text x="380" y="113" fill="#8B949E" font-size="10.5">Stateless Client-Pull Model</text>
  <rect x="46" y="134" width="543" height="190" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1" />
  <rect x="46" y="134" width="543" height="24" rx="4" fill="#16191F" stroke="#30363D" stroke-width="0.8" />
  <text x="56" y="150" fill="#79c0ff" font-size="10" font-weight="700">HTTP/1.1 WIRE PACKET INSPECTION (Sample Tag: TI-102)</text>
  <text x="56" y="174" fill="#ff7b72" font-size="8.8" font-family="monospace">&lt;-- CLIENT GET (850 Bytes Headers):</text>
  <text x="56" y="190" fill="#c9d1d9" font-size="8.8" font-family="monospace">    GET /api/v1/telemetry/TI-102 HTTP/1.1</text>
  <text x="56" y="206" fill="#8b949e" font-size="8.8" font-family="monospace">    Host: scada.meridiangrid.internal | User-Agent: Chrome/124.0.0 (X11)</text>
  <text x="56" y="222" fill="#8b949e" font-size="8.8" font-family="monospace">    Authorization: Bearer eyJhbGciOiJIUzI1Ni... (JWT Token 380B)</text>
  <text x="56" y="238" fill="#8b949e" font-size="8.8" font-family="monospace">    Cookie: session_id=9f8a3c4b; scada_route=idmz_gw_01; tls_ver=1.3</text>
  <text x="56" y="254" fill="#ff7b72" font-size="8.8" font-family="monospace">&lt;-- SERVER 200 OK (650 Bytes Headers + 4B Float Payload):</text>
  <text x="56" y="270" fill="#c9d1d9" font-size="8.8" font-family="monospace">    HTTP/1.1 200 OK | Date: Sun, 18 Oct 2026 15:30:00 GMT</text>
  <text x="56" y="286" fill="#8b949e" font-size="8.8" font-family="monospace">    Content-Type: application/json | Cache-Control: no-cache, no-store</text>
  <text x="56" y="302" fill="#ff7b72" font-size="8.8" font-family="monospace">    Payload: {"tag":"TI-102","val":148.65}  &lt;-- 4 Bytes Payload vs 1,500B Wire!</text>
  <rect x="46" y="339" width="543" height="240" rx="6" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <text x="56" y="359" fill="#C9D1D9" font-size="10.5" font-weight="700">Wire Timeline: High Packet Churn &amp; Dead-Time Blind Spots</text>
  <line x1="120" y1="374" x2="120" y2="564" stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="505" y1="374" x2="505" y2="564" stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="3,3" />
  <text x="120" y="371" fill="#79c0ff" font-size="9.5" font-weight="700" text-anchor="middle">Browser HMI</text>
  <text x="505" y="371" fill="#79c0ff" font-size="9.5" font-weight="700" text-anchor="middle">SCADA Gateway</text>
  <line x1="120" y1="394" x2="505" y2="409" stroke="#ff7b72" stroke-width="1.6" marker-end="url(#arr-red)" />
  <rect x="227" y="389" width="170" height="15" rx="2" fill="#1E222B" />
  <text x="312" y="400" fill="#ff7b72" font-size="8" text-anchor="middle">T=0ms: GET (850 Bytes Headers)</text>
  <line x1="505" y1="414" x2="120" y2="429" stroke="#ff7b72" stroke-width="1.6" marker-end="url(#arr-red)" />
  <rect x="217" y="411" width="190" height="15" rx="2" fill="#1E222B" />
  <text x="312" y="422" fill="#C9D1D9" font-size="8" text-anchor="middle">T=20ms: 200 OK (654B, TI-102=148.6°C)</text>
  <rect x="140" y="437" width="345" height="42" rx="4" fill="#2C1517" stroke="#ff7b72" stroke-width="1" />
  <text x="312" y="453" fill="#ff7b72" font-size="9" font-weight="700" text-anchor="middle">100 ms POLLING DEAD-TIME INTERVAL GAP</text>
  <text x="312" y="467" fill="#FFA198" font-size="8" text-anchor="middle">⚡ T=45ms: Thermal spike (158.2°C) occurs! Operator is blind to alarm!</text>
  <line x1="120" y1="487" x2="505" y2="502" stroke="#ff7b72" stroke-width="1.6" marker-end="url(#arr-red)" />
  <rect x="227" y="482" width="170" height="15" rx="2" fill="#1E222B" />
  <text x="312" y="493" fill="#ff7b72" font-size="8" text-anchor="middle">T=120ms: GET (850 Bytes Headers)</text>
  <line x1="505" y1="507" x2="120" y2="522" stroke="#ff7b72" stroke-width="1.6" marker-end="url(#arr-red)" />
  <rect x="207" y="504" width="210" height="15" rx="2" fill="#1E222B" />
  <text x="312" y="515" fill="#ff7b72" font-size="8" font-weight="700" text-anchor="middle">T=140ms: Alarm finally arrives (+95ms late!)</text>
  <rect x="46" y="591" width="543" height="105" rx="6" fill="#16191F" stroke="#ff7b72" stroke-width="1.2" />
  <text x="56" y="611" fill="#ff7b72" font-size="10.5" font-weight="700">HTTP Short Polling Operational Penalty (100 Hz Stream):</text>
  <text x="56" y="629" fill="#C9D1D9" font-size="9.5">• Continuous Wire Bandwidth: <tspan fill="#ff7b72" font-weight="700">1,203 kbps (150.4 KB/s)</tspan> per connected HMI client.</text>
  <text x="56" y="645" fill="#C9D1D9" font-size="9.5">• Payload Efficiency: <tspan fill="#ff7b72" font-weight="700">η = 0.26%</tspan> (99.74% of traffic is redundant header strings).</text>
  <text x="56" y="661" fill="#C9D1D9" font-size="9.5">• Socket Exhaustion: Hundreds of TCP handshakes/sec exhaust edge gateway sockets.</text>
  <text x="56" y="681" fill="#ff7b72" font-size="9.5" font-weight="700">✗ Unacceptable for sub-second industrial supervisory control (ISA-101).</text>
  <rect x="635" y="82" width="575" height="635" rx="8" fill="#1E222B" stroke="#30363D" stroke-width="1.2" />
  <rect x="651" y="96" width="340" height="26" rx="4" fill="#16191F" stroke="#3fb950" stroke-width="1.2" />
  <text x="659" y="113" fill="#3fb950" font-size="11" font-weight="700">2. WEBSOCKET STREAMING (RFC 6455)</text>
  <text x="1005" y="113" fill="#8B949E" font-size="10.5">Full-Duplex Persistent Socket</text>
  <rect x="651" y="134" width="543" height="190" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1" />
  <rect x="651" y="134" width="543" height="24" rx="4" fill="#16191F" stroke="#30363D" stroke-width="0.8" />
  <text x="661" y="150" fill="#79c0ff" font-size="10" font-weight="700">RFC 6455 WIRE PACKET INSPECTION (Binary Stream)</text>
  <text x="661" y="174" fill="#58a6ff" font-size="8.8" font-family="monospace">--&gt; INITIAL HTTP UPGRADE HANDSHAKE (One-Time Only at Connection Setup):</text>
  <text x="661" y="190" fill="#8b949e" font-size="8.8" font-family="monospace">    GET /telemetry/stream HTTP/1.1 | Upgrade: websocket | Connection: Upgrade</text>
  <text x="661" y="206" fill="#58a6ff" font-size="8.8" font-family="monospace">&lt;-- GATEWAY UPGRADE RESPONSE: 101 Switching Protocols</text>
  <text x="661" y="222" fill="#3fb950" font-size="8.8" font-family="monospace">================ RAW BINARY TELEMETRY FRAMES (2 BYTES OVERHEAD) ================</text>
  <text x="661" y="238" fill="#c9d1d9" font-size="8.8" font-family="monospace">&lt;-- SERVER PUSH 1: [0x82 0x04] [0x43 0x14 0xA6 0x66]  --&gt; TI-102 = 148.65°C</text>
  <text x="661" y="254" fill="#8b949e" font-size="8.8" font-family="monospace">    Byte 0: 0x82 (FIN=1, Opcode 0x2 Binary) | Byte 1: 0x04 (Len=4 Bytes)</text>
  <text x="661" y="270" fill="#c9d1d9" font-size="8.8" font-family="monospace">&lt;-- SERVER PUSH 2: [0x82 0x04] [0x43 0x14 0xB0 0x00]  --&gt; TI-102 = 148.69°C</text>
  <text x="661" y="286" fill="#3fb950" font-size="8.8" font-family="monospace">&lt;-- INSTANT ALARM PUSH: [0x82 0x08] [0x08 0x66 0x10 0x01 ...] (High Temp Trip)</text>
  <text x="661" y="302" fill="#3fb950" font-size="8.8" font-family="monospace">    Dispatched in &lt;1.2 ms directly into browser Web Worker ArrayBuffer!</text>
  <rect x="651" y="339" width="543" height="240" rx="6" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <text x="661" y="359" fill="#C9D1D9" font-size="10.5" font-weight="700">Wire Timeline: Zero Header Churn &amp; Instant Anomaly Delivery</text>
  <line x1="725" y1="374" x2="725" y2="564" stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="3,3" />
  <line x1="1110" y1="374" x2="1110" y2="564" stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="3,3" />
  <text x="725" y="371" fill="#79c0ff" font-size="9.5" font-weight="700" text-anchor="middle">Browser HMI</text>
  <text x="1110" y="371" fill="#79c0ff" font-size="9.5" font-weight="700" text-anchor="middle">SCADA Gateway</text>
  <line x1="1110" y1="399" x2="725" y2="404" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arr-green)" />
  <rect x="827" y="392" width="180" height="15" rx="2" fill="#1E222B" />
  <text x="917" y="403" fill="#3fb950" font-size="8" text-anchor="middle">T=10ms: WS Push (6B total: 2B + 4B)</text>
  <line x1="1110" y1="424" x2="725" y2="429" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arr-green)" />
  <rect x="827" y="417" width="180" height="15" rx="2" fill="#1E222B" />
  <text x="917" y="428" fill="#3fb950" font-size="8" text-anchor="middle">T=20ms: WS Push (6B total: 2B + 4B)</text>
  <rect x="745" y="446" width="345" height="42" rx="4" fill="#14261C" stroke="#3fb950" stroke-width="1" />
  <line x1="1100" y1="467" x2="740" y2="467" stroke="#3fb950" stroke-width="2.2" marker-end="url(#arr-green)" />
  <text x="917" y="462" fill="#3fb950" font-size="9" font-weight="700" text-anchor="middle">⚡ T=45ms: Thermal spike occurs at field sensor!</text>
  <text x="917" y="480" fill="#E6EDF3" font-size="8" text-anchor="middle">INSTANT PUSH: Dispatched in 1.2ms; arrives at HMI at T=46.2ms!</text>
  <line x1="725" y1="514" x2="1110" y2="519" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arr-blue)" />
  <rect x="812" y="507" width="210" height="15" rx="2" fill="#1E222B" />
  <text x="917" y="518" fill="#79c0ff" font-size="8" text-anchor="middle">T=70ms: DUPLEX SETPOINT COMMAND (6B Masked)</text>
  <rect x="651" y="591" width="543" height="105" rx="6" fill="#16191F" stroke="#3fb950" stroke-width="1.2" />
  <text x="661" y="611" fill="#3fb950" font-size="10.5" font-weight="700">WebSocket Operational Advantage (100 Hz Stream):</text>
  <text x="661" y="629" fill="#C9D1D9" font-size="9.5">• Continuous Wire Bandwidth: <tspan fill="#3fb950" font-weight="700">4.8 kbps (0.6 KB/s)</tspan> per connected client.</text>
  <text x="661" y="645" fill="#C9D1D9" font-size="9.5">• Payload Efficiency: <tspan fill="#3fb950" font-weight="700">η = 66.7%</tspan> (<tspan fill="#3fb950" font-weight="700">99.60% bandwidth reduction!</tspan>).</text>
  <text x="661" y="661" fill="#C9D1D9" font-size="9.5">• Single Multiplexed TCP Connection: Zero connection churn; sub-millisecond duplex.</text>
  <text x="661" y="681" fill="#3fb950" font-size="9.5" font-weight="700">✓ Foundational real-time transport pattern.</text>
  <rect x="30" y="734" width="1180" height="32" rx="6" fill="#1E222B" stroke="#30363D" stroke-width="1" />
  <text x="45" y="754" fill="#3fb950" font-size="10" font-weight="700">✓ Invariant: 99.6% Bandwidth Reduction</text>
  <text x="280" y="754" fill="#8B949E" font-size="9.5">WebSocket replaces 1,500-byte HTTP header bloat with deterministic 2-byte binary framing</text>
  <text x="860" y="754" fill="#ff7b72" font-size="10" font-weight="700">✗ Reject HTTP Polling &amp; SSE</text>
  <text x="1040" y="754" fill="#8B949E" font-size="9.5">Eliminates dead-time intervals</text>
</svg>