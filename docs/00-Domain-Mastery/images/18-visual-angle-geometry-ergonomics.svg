  <rect width="1240" height="760" rx="12" fill="#16191F" stroke="#30363D" stroke-width="1.5" class="bg" />
  <text x="620" y="36" fill="#F0F6FC" font-size="19" font-weight="700" text-anchor="middle">Visual Angle Presentation Geometry &amp; Retinal Field Cones</text>
  <text x="620" y="58" fill="#8B949E" font-size="12" text-anchor="middle">Paivio-Mayer Dual-Coding · Tracing Angular Velocity ω = dθ/dt and Viewing Cones (Tong et al., 2026)</text>
