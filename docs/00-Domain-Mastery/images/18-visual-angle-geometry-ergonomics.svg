  <rect x="46" y="96" width="250" height="26" rx="4" fill="#16191F" stroke="#388bfd" stroke-width="1.2" />
  <text x="54" y="113" fill="#79c0ff" font-size="11" font-weight="700">1. RETINAL RAY TRACING GEOMETRY</text>
  <text x="310" y="113" fill="#8B949E" font-size="10.5">Biomechanical Optical Plane</text>
  <polygon points="125,282 410,162 410,402" fill="#388bfd" fill-opacity="0.06" />
  <polygon points="125,282 410,207 410,357" fill="#388bfd" fill-opacity="0.10" />
  <polygon points="125,282 410,252 410,312" fill="#388bfd" fill-opacity="0.16" />
