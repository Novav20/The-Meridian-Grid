  <path d="M 118 268 A 16 16 0 0 1 118 296 Z" fill="#388bfd" fill-opacity="0.4" />
  <circle cx="117" cy="282" r="8" fill="#58a6ff" />
  <circle cx="120" cy="282" r="3.5" fill="#FFFFFF" />
  <text x="110" y="320" fill="#C9D1D9" font-size="10" font-weight="700" text-anchor="middle">Human Eye</text>
  <text x="110" y="332" fill="#8B949E" font-size="8.5" text-anchor="middle">Retina &amp; Fovea</text>
  <line x1="410" y1="154" x2="410" y2="410" stroke="#E6EDF3" stroke-width="3.5" stroke-linecap="round" />
