<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="100%" height="100%" style="background-color: #16191F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#212631" />
      <stop offset="100%" stop-color="#1A1E26" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    
    <!-- Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#388bfd" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff7b72" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b949e" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1180" height="700" rx="12" fill="#16191F" />

  <!-- Title & Subtitle -->
  <text x="590" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#f0f6fc">Telemetry Conflation Engine &amp; Dual-Tier Backpressure Architecture</text>
  <text x="590" y="60" text-anchor="middle" font-size="12" fill="#8b949e">Server-side frame coalescing segregates high-frequency analog metrics (LVC) from discrete auditable SOE alarms (FIFO)</text>

  <!-- ==================== TOP COMPARISON: UNREGULATED INGESTION (FAILURE MODE) ==================== -->
  <rect x="35" y="80" width="1110" height="150" rx="8" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1" />
  
  <!-- Section Badge -->
  <rect x="50" y="92" width="225" height="22" rx="4" fill="#2d1d24" stroke="#ff7b72" stroke-width="1" />
  <circle cx="62" cy="103" r="4" fill="#ff7b72" />
  <text x="74" y="107" font-size="11" font-weight="700" fill="#ff7b72">FAILURE MODE: Unregulated Push</text>

  <!-- Field Sensor Burst -->
  <rect x="50" y="125" width="230" height="90" rx="6" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <text x="65" y="145" font-size="11" font-weight="700" fill="#c9d1d9">Field Sensor Burst (100 Hz)</text>
  <text x="65" y="162" font-size="10" font-family="monospace" fill="#79c0ff">TIC-102: 5 updates / 16.6 ms</text>
  <text x="65" y="177" font-size="10" font-family="monospace" fill="#8b949e">[182.1, 182.3, 182.4, 182.6, 182.9]</text>
  <text x="65" y="197" font-size="10" fill="#8b949e">Unfiltered push over WebSocket</text>

  <!-- Wire Arrow to Server -->
  <path d="M 280 170 L 375 170" fill="none" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowRed)" />
  <text x="328" y="162" font-size="9" text-anchor="middle" font-family="monospace" fill="#ff7b72">100 frames/s</text>

  <!-- Naive Gateway -->
  <rect x="380" y="125" width="230" height="90" rx="6" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <text x="395" y="145" font-size="11" font-weight="700" fill="#c9d1d9">Naive Forwarding Gateway</text>
  <text x="395" y="162" font-size="10" fill="#8b949e">No backpressure checks</text>
  <text x="395" y="177" font-size="10" fill="#8b949e">Every raw packet forwarded</text>
  <text x="395" y="197" font-size="10" font-family="monospace" fill="#ff7b72">bufferedAmount check = NULL</text>

  <!-- Wire Arrow to Client -->
  <path d="M 610 170 L 705 170" fill="none" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowRed)" />
  <text x="658" y="162" font-size="9" text-anchor="middle" font-family="monospace" fill="#ff7b72">Wire Saturated</text>

  <!-- Client Buffer Bloat -->
  <rect x="710" y="125" width="415" height="90" rx="6" fill="#16191F" stroke="#ff7b72" stroke-width="1" />
  <text x="725" y="145" font-size="11" font-weight="700" fill="#ff7b72">Client WebSocket Queue: Buffer Bloat &amp; UI Freeze</text>
  <text x="725" y="163" font-size="10" font-family="monospace" fill="#f0f6fc">ws.bufferedAmount = 1,420 Frames (Memory Leak / OOM Risk)</text>
  <text x="725" y="180" font-size="10" fill="#8b949e">Display limited to 60 FPS (16.6 ms budget) &#8594; UI thread spends 100% CPU parsing old history</text>
  <text x="725" y="198" font-size="10" font-weight="600" fill="#ff7b72">&#215; Industrial Hazard: Operator views delayed values (~15s stale); missed emergency trips!</text>

  <!-- ==================== MAIN ARCHITECTURE: DUAL-TIER CONFLATION ENGINE ==================== -->
  <rect x="35" y="245" width="1110" height="425" rx="8" fill="url(#cardGrad)" stroke="#30363D" stroke-width="1" />
  
  <!-- Section Badge -->
  <rect x="50" y="258" width="285" height="22" rx="4" fill="#1b2a22" stroke="#3fb950" stroke-width="1" />
  <circle cx="62" cy="269" r="4" fill="#3fb950" />
  <text x="74" y="273" font-size="11" font-weight="700" fill="#3fb950">Dual-Tier Conflation</text>

  <!-- Column 1: Field Ingress Stream (x=50, w=220) -->
  <rect x="50" y="295" width="220" height="355" rx="6" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <text x="65" y="320" font-size="12" font-weight="700" fill="#c9d1d9">1. High-Speed Ingress</text>
  <text x="65" y="338" font-size="10" fill="#8b949e">Sparkplug B MQTT UNS Stream</text>

  <!-- Ingress Tag Cards -->
  <!-- Tag 1: TIC-102 -->
  <rect x="62" y="355" width="196" height="58" rx="4" fill="#1E222B" stroke="#30363D" stroke-width="1" />
  <rect x="70" y="363" width="55" height="15" rx="2" fill="#1f3b58" />
  <text x="74" y="374" font-size="9" font-family="monospace" font-weight="700" fill="#79c0ff">ANALOG</text>
  <text x="135" y="374" font-size="10" font-family="monospace" fill="#c9d1d9">TIC-102 (100 Hz)</text>
  <text x="70" y="394" font-size="9" font-family="monospace" fill="#8b949e">T=0ms: 182.1&#176;C &#8594; 182.3 &#8594; 182.9</text>
  <text x="70" y="405" font-size="8" fill="#388bfd">5 samples within 16.6ms window</text>

  <!-- Tag 2: LT-102 -->
  <rect x="62" y="420" width="196" height="54" rx="4" fill="#1E222B" stroke="#30363D" stroke-width="1" />
  <rect x="70" y="428" width="55" height="15" rx="2" fill="#1f3b58" />
  <text x="74" y="439" font-size="9" font-family="monospace" font-weight="700" fill="#79c0ff">ANALOG</text>
  <text x="135" y="439" font-size="10" font-family="monospace" fill="#c9d1d9">LT-102 (50 Hz)</text>
  <text x="70" y="458" font-size="9" font-family="monospace" fill="#8b949e">T=8ms: 64.2% &#8594; 64.5%</text>

  <!-- Tag 3: PUMP_P101A_TRIP -->
  <rect x="62" y="482" width="196" height="54" rx="4" fill="#1E222B" stroke="#ff7b72" stroke-width="1" />
  <rect x="70" y="490" width="50" height="15" rx="2" fill="#3d1e24" />
  <text x="75" y="501" font-size="9" font-family="monospace" font-weight="700" fill="#ff7b72">ALARM</text>
  <text x="130" y="501" font-size="10" font-family="monospace" font-weight="700" fill="#ff7b72">PUMP_P101A</text>
  <text x="70" y="520" font-size="9" font-family="monospace" fill="#f0f6fc">T=12ms: STATE = TRIP</text>

  <!-- Tag 4: FV-108_ACK -->
  <rect x="62" y="544" width="196" height="54" rx="4" fill="#1E222B" stroke="#3fb950" stroke-width="1" />
  <rect x="70" y="552" width="46" height="15" rx="2" fill="#1b2e22" />
  <text x="74" y="563" font-size="9" font-family="monospace" font-weight="700" fill="#3fb950">AUDIT</text>
  <text x="126" y="563" font-size="10" font-family="monospace" fill="#3fb950">FV-108_ACK</text>
  <text x="70" y="582" font-size="9" font-family="monospace" fill="#c9d1d9">T=14ms: OP_ACK = TRUE</text>

  <!-- Metric Ingress Footer -->
  <text x="65" y="625" font-size="9.5" fill="#8b949e">Unfiltered MQTT UNS Topic Stream</text>
  <text x="65" y="638" font-size="9" font-family="monospace" fill="#79c0ff">spBv1.0/PlantA/Reboiler/...</text>

  <!-- Arrows from Column 1 to Column 2 -->
  <path d="M 270 384 L 320 384" fill="none" stroke="#388bfd" stroke-width="1.5" marker-end="url(#arrowBlue)" />
  <path d="M 270 447 L 320 447" fill="none" stroke="#388bfd" stroke-width="1.5" marker-end="url(#arrowBlue)" />
  <path d="M 270 509 L 320 509" fill="none" stroke="#ff7b72" stroke-width="1.5" marker-end="url(#arrowRed)" />
  <path d="M 270 571 L 320 571" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrowGreen)" />

  <!-- Column 2: Ingress Classifier & Demux (x=325, w=150) -->
  <rect x="325" y="295" width="150" height="355" rx="6" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <text x="340" y="320" font-size="12" font-weight="700" fill="#c9d1d9">2. Ingress Demux</text>
  <text x="340" y="338" font-size="10" fill="#8b949e">Metric Classification</text>

  <rect x="335" y="360" width="130" height="90" rx="4" fill="#1E222B" stroke="#30363D" stroke-width="1" />
  <text x="345" y="380" font-size="10" font-weight="700" fill="#79c0ff">Continuous Process</text>
  <text x="345" y="396" font-size="9" fill="#8b949e">&#8226; Temperature</text>
  <text x="345" y="410" font-size="9" fill="#8b949e">&#8226; Level &amp; Pressure</text>
  <text x="345" y="424" font-size="9" fill="#8b949e">&#8226; Flow &amp; RPM</text>
  <text x="345" y="440" font-size="8.5" font-weight="700" fill="#79c0ff">&#8594; Route to Tier 1 LVC</text>

  <rect x="335" y="480" width="130" height="90" rx="4" fill="#1E222B" stroke="#30363D" stroke-width="1" />
  <text x="345" y="500" font-size="10" font-weight="700" fill="#ff7b72">Discrete Events</text>
  <text x="345" y="516" font-size="9" fill="#8b949e">&#8226; Interlock Trips</text>
  <text x="345" y="530" font-size="9" fill="#8b949e">&#8226; Safety Breakers</text>
  <text x="345" y="544" font-size="9" fill="#8b949e">&#8226; Operator Setpoints</text>
  <text x="345" y="560" font-size="8.5" font-weight="700" fill="#ff7b72">&#8594; Route to Tier 2 FIFO</text>

  <text x="340" y="610" font-size="9" fill="#8b949e">Zero inspection delay:</text>
  <text x="340" y="625" font-size="9" font-family="monospace" fill="#c9d1d9">Tag.DataType == INT</text>
  <text x="340" y="638" font-size="9" font-family="monospace" fill="#c9d1d9">  || Tag.IsAlarm</text>

  <!-- Arrows from Demux to Tier 1 & Tier 2 -->
  <path d="M 475 405 L 515 405" fill="none" stroke="#388bfd" stroke-width="1.5" marker-end="url(#arrowBlue)" />
  <path d="M 475 525 L 515 525" fill="none" stroke="#ff7b72" stroke-width="1.5" marker-end="url(#arrowRed)" />

  <!-- Column 3: The Dual-Tier Conflation Queues (x=520, w=300) -->
  <rect x="520" y="295" width="300" height="355" rx="6" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <text x="535" y="320" font-size="12" font-weight="700" fill="#c9d1d9">3. Gateway Conflation Tiers</text>
  <text x="535" y="338" font-size="10" fill="#8b949e">RAM Memory Mapping &amp; Order Guarantee</text>

  <!-- Tier 1: LVC Hash Map Box -->
  <rect x="532" y="355" width="276" height="110" rx="4" fill="#1E222B" stroke="#388bfd" stroke-width="1" />
  <rect x="542" y="365" width="256" height="18" rx="2" fill="#16191F" />
  <text x="548" y="378" font-size="9.5" font-weight="700" fill="#79c0ff">TIER 1: Last-Value Cache (LVC Hash Map)</text>
  
  <text x="542" y="400" font-size="9" fill="#8b949e">In-Place Overwrite (Lossy for intermediate deltas):</text>
  <rect x="542" y="408" width="256" height="22" rx="2" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <text x="548" y="423" font-size="9" font-family="monospace" fill="#79c0ff">Key: "TIC-102" &#8594; Val: 182.9&#176;C [DIRTY]</text>
  <text x="542" y="443" font-size="8.5" fill="#8b949e">Intermediate samples 182.1, 182.3, 182.4, 182.6 dropped</text>
  <text x="542" y="456" font-size="8.5" font-family="monospace" fill="#3fb950">&#10003; 80% wire reduction; matches human eye limit</text>

  <!-- Tier 2: Lossless FIFO Queue Box -->
  <rect x="532" y="475" width="276" height="110" rx="4" fill="#1E222B" stroke="#ff7b72" stroke-width="1" />
  <rect x="542" y="485" width="256" height="18" rx="2" fill="#16191F" />
  <text x="548" y="498" font-size="9.5" font-weight="700" fill="#ff7b72">TIER 2: Lossless FIFO Audit Queue</text>

  <text x="542" y="520" font-size="9" fill="#8b949e">Strict Sequential Order (Zero Loss Policy):</text>
  <!-- Queue Elements -->
  <rect x="542" y="528" width="125" height="22" rx="2" fill="#3d1e24" stroke="#ff7b72" stroke-width="1" />
  <text x="546" y="542" font-size="8.5" font-family="monospace" fill="#ff7b72">1: PUMP_P101A_TRIP</text>

  <rect x="672" y="528" width="125" height="22" rx="2" fill="#1b2e22" stroke="#3fb950" stroke-width="1" />
  <text x="676" y="542" font-size="8.5" font-family="monospace" fill="#3fb950">2: FV-108_ACK</text>

  <text x="542" y="563" font-size="8.5" fill="#8b949e">SOE sequence preserved for alarm audit trail</text>
  <text x="542" y="576" font-size="8.5" font-family="monospace" fill="#3fb950">&#10003; Never dropped, coalesced, or delayed</text>

  <!-- Backpressure Check Bar -->
  <rect x="532" y="595" width="276" height="42" rx="4" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <text x="542" y="611" font-size="9.5" font-weight="700" fill="#c9d1d9">Socket Backpressure Feedback:</text>
  <text x="542" y="626" font-size="8.5" font-family="monospace" fill="#3fb950">ws.bufferedAmount &lt; 64KB &#8594; Drain Tier 1 &amp; Tier 2</text>

  <!-- Arrows from Column 3 to Column 4 -->
  <path d="M 808 410 L 845 440" fill="none" stroke="#388bfd" stroke-width="1.5" marker-end="url(#arrowBlue)" />
  <path d="M 808 530 L 845 470" fill="none" stroke="#ff7b72" stroke-width="1.5" marker-end="url(#arrowRed)" />

  <!-- Column 4: Display Frame Dispatcher & Egress (x=850, w=265) -->
  <rect x="850" y="295" width="265" height="355" rx="6" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <text x="865" y="320" font-size="12" font-weight="700" fill="#c9d1d9">4. 60 Hz Display Dispatcher</text>
  <text x="865" y="338" font-size="10" fill="#8b949e">Coalesced Frame Assembly (16.6ms Tick)</text>

  <!-- Coalesced Frame Payload Box -->
  <rect x="862" y="355" width="241" height="145" rx="4" fill="#1E222B" stroke="#3fb950" stroke-width="1" />
  <rect x="870" y="365" width="225" height="18" rx="2" fill="#16191F" />
  <text x="876" y="378" font-size="9.5" font-weight="700" fill="#3fb950">COALESCED PROTOBUF BUNDLE</text>

  <text x="870" y="400" font-size="9" fill="#8b949e">Single binary frame dispatched per tick:</text>
  <rect x="870" y="407" width="225" height="42" rx="2" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <text x="876" y="421" font-size="8.5" font-family="monospace" fill="#79c0ff">&#8226; LVC State: TIC-102=182.9, LT-102=64.5</text>
  <text x="876" y="433" font-size="8.5" font-family="monospace" fill="#ff7b72">&#8226; FIFO Alarms: [PUMP_P101A_TRIP]</text>
  <text x="876" y="444" font-size="8.5" font-family="monospace" fill="#3fb950">&#8226; Audit Events: [FV-108_ACK]</text>

  <text x="870" y="465" font-size="8.5" fill="#8b949e">RFC 6455 Framing Overhead: strictly 2 bytes</text>
  <text x="870" y="478" font-size="8.5" font-family="monospace" fill="#c9d1d9">Opcode: 0x2 (Binary Protobuf DDATA)</text>
  <text x="870" y="491" font-size="8.5" font-weight="600" fill="#3fb950">&#10003; Zero UTF-8 overhead &amp; zero buffer bloat</text>

  <!-- Client HMI Box -->
  <rect x="862" y="515" width="241" height="120" rx="4" fill="#1E222B" stroke="#30363D" stroke-width="1" />
  <text x="872" y="535" font-size="10.5" font-weight="700" fill="#c9d1d9">HMI Browser SPA (Web Worker)</text>
  <text x="872" y="552" font-size="9" fill="#8b949e">1. ArrayBuffer transferred with zero-copy</text>
  <text x="872" y="567" font-size="9" fill="#8b949e">2. Off-main-thread Protobuf deserialization</text>
  <text x="872" y="582" font-size="9" fill="#8b949e">3. Immediate reactive signal update in UI</text>
  <rect x="870" y="593" width="225" height="26" rx="2" fill="#1b2e22" stroke="#3fb950" stroke-width="1" />
  <text x="878" y="610" font-size="9" font-weight="700" fill="#3fb950">&#10003; 60 FPS Steady; 0ms Operator Blindness</text>

</svg>
