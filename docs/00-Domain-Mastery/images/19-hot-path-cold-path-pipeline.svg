<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="100%" height="100%" style="background:#16191f; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<style>
.title { fill: #f0f6fc; font-size: 17px; font-weight: 700; }
.subtitle { fill: #8b949e; font-size: 11.5px; }
.card-box { fill: #0d1117; stroke: #30363d; stroke-width: 1.2; rx: 6; }
.hdr { font-size: 12px; font-weight: 700; }
.sub-hdr { font-size: 10px; font-weight: 600; }
.txt-body { font-size: 9px; fill: #8b949e; }
.txt-code { font-family: monospace; font-size: 8.5px; }
.badge { font-size: 8px; font-weight: 700; text-anchor: middle; }
</style>

<defs>
<!-- Gradients & Markers -->
<marker id="arrow-hot" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149" />
</marker>
<marker id="arrow-cold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
</marker>
<marker id="arrow-ingress" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M 0 1 L 10 5 L 0 9 z" fill="#a371f7" />
</marker>
<linearGradient id="hotGrad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#3b1e22" stop-opacity="0.8" />
<stop offset="100%" stop-color="#161b22" stop-opacity="0.8" />
</linearGradient>
<linearGradient id="coldGrad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#1a2d42" stop-opacity="0.8" />
<stop offset="100%" stop-color="#161b22" stop-opacity="0.8" />
</linearGradient>
</defs>

<!-- Title & Subtitle -->
<text x="490" y="27" class="title" text-anchor="middle">Dual-Path Telemetry Architecture: Hot Path vs. Cold Path Bifurcation</text>
<text x="490" y="45" class="subtitle" text-anchor="middle">In-Memory Reactive Streaming (&lt; 25–50 ms) vs. Batch Time-Series Persistence &amp; Historian Queries (150–300 ms)</text>

<!-- ================= LEFT: INGRESS & MESSAGE BROKER (UNS) ================= -->
<g transform="translate(25, 65)">
<rect x="0" y="0" width="225" height="410" class="card-box" stroke="#a371f7" stroke-width="1.2" />
<text x="15" y="24" class="hdr" fill="#bc8cff">1. Field Ingress &amp; UNS Fabric</text>
<text x="15" y="38" class="txt-body">Authoritative operational event stream</text>

<!-- EoN Node / Edge -->
<g transform="translate(15, 52)">
<rect x="0" y="0" width="195" height="72" rx="4" fill="#161b22" stroke="#30363d" />
<circle cx="16" cy="18" r="5" fill="#3fb950" />
<text x="28" y="21" class="sub-hdr" fill="#e6edf3">Field EoN Gateways &amp; PLCs</text>
<text x="15" y="40" class="txt-body">• Sparkplug B / Protobuf Telemetry</text>
<text x="15" y="53" class="txt-body">• 10,000+ tag updates / second</text>
<text x="15" y="66" class="txt-code" fill="#7ee787">Topic: spBv1.0/Plant1/DDATA/Cell2</text>
</g>

<!-- Down arrow to broker -->
<path d="M 112 124 L 112 145" stroke="#a371f7" stroke-width="2" marker-end="url(#arrow-ingress)" />
<text x="118" y="138" fill="#bc8cff" font-size="8" font-family="monospace">TCP / TLS</text>

<!-- Message Broker Box -->
<g transform="translate(15, 148)">
<rect x="0" y="0" width="195" height="110" rx="4" fill="#211a36" stroke="#8957e5" stroke-width="1.2" />
<rect x="12" y="10" width="171" height="20" rx="3" fill="#2d2254" />
<text x="97" y="24" fill="#d2a8ff" font-size="10" font-weight="700" text-anchor="middle">Unified Namespace (UNS) Broker</text>

<text x="15" y="48" class="txt-body">• High-throughput in-memory bus</text>
<text x="15" y="62" class="txt-body">• Non-blocking Pub/Sub distribution</text>
<text x="15" y="76" class="txt-body">• Zero persistence requirement on broker</text>

<g transform="translate(12, 85)">
<rect x="0" y="0" width="171" height="18" rx="2" fill="#161b22" stroke="#30363d" />
<text x="85" y="12" fill="#79c0ff" font-size="8" text-anchor="middle">Data Ownership: Ingress Node Only</text>
</g>
</g>

<!-- Decoupling Note Box -->
<g transform="translate(15, 275)">
<rect x="0" y="0" width="195" height="120" rx="4" fill="#161b22" stroke="#f0883e" stroke-dasharray="3 3" />
<text x="12" y="18" fill="#ffa657" font-size="9.5" font-weight="700">Decoupling Invariant</text>
<text x="12" y="34" class="txt-body">The broker decouples real-time</text>
<text x="12" y="46" class="txt-body">monitoring from historical storage.</text>
<text x="12" y="62" class="txt-body">• No shared lock contention</text>
<text x="12" y="74" class="txt-body">• DB failure does NOT freeze WSS</text>
<text x="12" y="86" class="txt-body">• Slow consumers isolated by queue</text>
<text x="12" y="104" fill="#8b949e" font-size="8" font-style="italic">Villamar et al. (2025); Grigat (2026)</text>
</g>
</g>

<!-- Flow Arrows leaving Broker to Hot and Cold Paths -->
<!-- Upper curve to Hot Path -->
<path d="M 235 220 C 255 220, 255 130, 275 130" fill="none" stroke="#f85149" stroke-width="2.5" marker-end="url(#arrow-hot)" />
<rect x="238" y="145" width="30" height="14" rx="2" fill="#3b1e22" stroke="#f85149" />
<text x="253" y="155" fill="#ff7b72" font-size="7.5" font-weight="700" text-anchor="middle">HOT</text>

<!-- Lower curve to Cold Path -->
<path d="M 235 235 C 255 235, 255 330, 275 330" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrow-cold)" />
<rect x="238" y="295" width="30" height="14" rx="2" fill="#1a2d42" stroke="#58a6ff" />
<text x="253" y="305" fill="#79c0ff" font-size="7.5" font-weight="700" text-anchor="middle">COLD</text>

<!-- ================= TOP RIGHT: HOT PATH (< 50ms) ================= -->
<g transform="translate(280, 65)">
<rect x="0" y="0" width="675" height="195" class="card-box" fill="url(#hotGrad)" stroke="#f85149" stroke-width="1.5" />

<!-- Header & Latency Badge -->
<text x="20" y="24" class="hdr" fill="#ff7b72">2. HOT PATH: In-Memory Stream &amp; Operator Synoptics</text>
<rect x="495" y="10" width="165" height="20" rx="3" fill="#da3633" />
<text x="577" y="23" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">Target: &lt; 25 ms – 50 ms Latency</text>

<!-- Sub-boxes in Hot Path -->
<!-- 1. WSS Ingestion Engine -->
<g transform="translate(20, 42)">
<rect x="0" y="0" width="195" height="135" rx="4" fill="#0d1117" stroke="#30363d" />
<rect x="0" y="0" width="195" height="22" rx="4" fill="#21262d" />
<text x="10" y="15" fill="#f0f6fc" font-size="9.5" font-weight="700">WebSocket Streaming Gateway</text>

<text x="10" y="38" class="txt-body">• Subscribes directly to broker bus</text>
<text x="10" y="52" class="txt-body">• Zero Disk I/O dependency</text>
<text x="10" y="66" class="txt-body">• In-memory ring buffer cache</text>
<text x="10" y="80" class="txt-body">• Protocol payload packing (Protobuf)</text>
<text x="10" y="94" class="txt-body">• Event-driven push to connected clients</text>

<rect x="10" y="105" width="175" height="18" rx="2" fill="#161b22" stroke="#f85149" />
<text x="97" y="117" fill="#ff7b72" font-size="8" font-weight="600" text-anchor="middle">Bypasses SQL Database Completely</text>
</g>

<!-- Arrow between Gateway and Client -->
<path d="M 218 108 L 245 108" stroke="#f85149" stroke-width="2" marker-end="url(#arrow-hot)" />
<text x="232" y="100" fill="#ff7b72" font-size="7.5" font-family="monospace" text-anchor="middle">WSS</text>

<!-- 2. Web SCADA HMI Client -->
<g transform="translate(250, 42)">
<rect x="0" y="0" width="220" height="135" rx="4" fill="#0d1117" stroke="#30363d" />
<rect x="0" y="0" width="220" height="22" rx="4" fill="#21262d" />
<text x="10" y="15" fill="#f0f6fc" font-size="9.5" font-weight="700">Browser Web SCADA Client</text>

<text x="10" y="38" class="txt-body">• Direct WebSocket Binary Frame reception</text>
<text x="10" y="52" class="txt-body">• Web Worker parsing (off main UI thread)</text>
<text x="10" y="66" class="txt-body">• SharedArrayBuffer &amp; Atomics lock-free</text>
<text x="10" y="80" class="txt-body">• Live SVG &amp; Canvas refresh at 60 FPS</text>
<text x="10" y="94" class="txt-body">• Real-time Level 1–2 Alarm triggers</text>

<rect x="10" y="105" width="200" height="18" rx="2" fill="#1b4725" stroke="#2ea043" />
<text x="110" y="117" fill="#3fb950" font-size="8" font-weight="600" text-anchor="middle">20 updates/s (25–50 ms) [Bellini 2022]</text>
</g>

<!-- 3. Key Invariants & Benchmarks Box -->
<g transform="translate(485, 42)">
<rect x="0" y="0" width="175" height="135" rx="4" fill="#161b22" stroke="#30363d" />
<text x="10" y="18" fill="#e6edf3" font-size="9.5" font-weight="700">Hot Path Characteristics</text>

<text x="10" y="36" class="txt-body">• Latency: <tspan fill="#ff7b72" font-weight="700">&lt; 25–50 ms</tspan></text>
<text x="10" y="50" class="txt-body">• Transport: <tspan fill="#e6edf3">WSS (Binary Protobuf)</tspan></text>
<text x="10" y="64" class="txt-body">• Workload: <tspan fill="#e6edf3">Transient telemetry</tspan></text>
<text x="10" y="78" class="txt-body">• Interlock: <tspan fill="#3fb950">Sub-25 ms dispatch</tspan></text>
<text x="10" y="92" class="txt-body">• Fault Domain: <tspan fill="#d2a8ff">Zero disk coupling</tspan></text>

<line x1="10" y1="102" x2="165" y2="102" stroke="#30363d" stroke-width="1" />
<text x="10" y="116" fill="#8b949e" font-size="7.8" font-style="italic">Grigat et al. (2026);</text>
<text x="10" y="127" fill="#8b949e" font-size="7.8" font-style="italic">Bellini et al. (2022)</text>
</g>
</g>

<!-- ================= BOTTOM RIGHT: COLD PATH (150-300ms) ================= -->
<g transform="translate(280, 275)">
<rect x="0" y="0" width="675" height="200" class="card-box" fill="url(#coldGrad)" stroke="#388bfd" stroke-width="1.5" />

<!-- Header & Latency Badge -->
<text x="20" y="24" class="hdr" fill="#58a6ff">3. COLD PATH: Time-Series Persistence &amp; Historical Analytics</text>
<rect x="495" y="10" width="165" height="20" rx="3" fill="#1f6feb" />
<text x="577" y="23" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">Query Latency: 156 ms – 300 ms</text>

<!-- Sub-boxes in Cold Path -->
<!-- 1. Batch Accumulator -->
<g transform="translate(20, 42)">
<rect x="0" y="0" width="195" height="142" rx="4" fill="#0d1117" stroke="#30363d" />
<rect x="0" y="0" width="195" height="22" rx="4" fill="#21262d" />
<text x="10" y="15" fill="#f0f6fc" font-size="9.5" font-weight="700">Batch Accumulator Worker</text>

<text x="10" y="38" class="txt-body">• Subscribes to broker telemetry topic</text>
<text x="10" y="52" class="txt-body">• In-memory ring queue buffer</text>
<text x="10" y="66" class="txt-body">• Flushes every 1,000 rows or 500 ms</text>
<text x="10" y="80" class="txt-body">• Uses bulk SQL COPY / multi-INSERT</text>
<text x="10" y="94" class="txt-body">• Reduces WAL &amp; transaction locks &gt;95%</text>

<rect x="10" y="110" width="175" height="22" rx="2" fill="#161b22" stroke="#58a6ff" />
<text x="97" y="124" fill="#79c0ff" font-size="8" font-weight="600" text-anchor="middle">Prevents Disk I/O Saturation</text>
</g>

<!-- Arrow between Accumulator and DB -->
<path d="M 218 108 L 245 108" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-cold)" />
<text x="232" y="100" fill="#58a6ff" font-size="7.5" font-family="monospace" text-anchor="middle">COPY</text>

<!-- 2. Relational TimescaleDB Hypertables -->
<g transform="translate(250, 42)">
<rect x="0" y="0" width="220" height="142" rx="4" fill="#0d1117" stroke="#30363d" />
<rect x="0" y="0" width="220" height="22" rx="4" fill="#21262d" />
<text x="10" y="15" fill="#f0f6fc" font-size="9.5" font-weight="700">TimescaleDB / Hypertable Chunks</text>

<text x="10" y="38" class="txt-body">• Append-only time-partitioned chunks</text>
<text x="10" y="52" class="txt-body">• Gorilla XOR &amp; Delta-of-Delta compression</text>
<text x="10" y="66" class="txt-body">• ~12:1 storage volume reduction</text>
<text x="10" y="80" class="txt-body">• Indexed by (metric_id, time DESC)</text>
<text x="10" y="94" class="txt-body">• Multi-tier tiering to Parquet / Lakehouse</text>

<rect x="10" y="110" width="200" height="22" rx="2" fill="#162032" stroke="#388bfd" />
<text x="110" y="124" fill="#58a6ff" font-size="8" font-weight="600" text-anchor="middle">Villamar et al. (2025): 156–300 ms SQL</text>
</g>

<!-- Arrow between DB and REST/Historical Viewer -->
<path d="M 473 108 L 485 108" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-cold)" />

<!-- 3. Query API & Analytical Clients -->
<g transform="translate(490, 42)">
<rect x="0" y="0" width="170" height="142" rx="4" fill="#161b22" stroke="#30363d" />
<text x="10" y="18" fill="#e6edf3" font-size="9.5" font-weight="700">RESTful Query &amp; Auditing</text>

<text x="10" y="36" class="txt-body">• HTTPS RESTful / GraphQL API</text>
<text x="10" y="50" class="txt-body">• Multi-day trends &amp; zoom</text>
<text x="10" y="64" class="txt-body">• Machine Learning model training</text>
<text x="10" y="78" class="txt-body">• Regulatory compliance logs</text>
<text x="10" y="92" class="txt-body">• Isolated from live SCADA screens</text>

<line x1="10" y1="104" x2="160" y2="104" stroke="#30363d" stroke-width="1" />
<text x="10" y="118" fill="#e3b341" font-size="8" font-weight="700">Database Heavy Query Load</text>
<text x="10" y="130" fill="#8b949e" font-size="7.8">Never starves Hot Path stream</text>
</g>
</g>
</svg>