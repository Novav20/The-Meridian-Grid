  <rect x="105" y="503" width="210" height="66" rx="4" fill="#16191F" stroke="#30363D" stroke-width="0.8" />
  <line x1="115" y1="519" x2="140" y2="519" stroke="#3fb950" stroke-width="2.2" />
  <text x="147" y="523" fill="#3fb950" font-size="9" font-weight="700">4°/s – 8°/s (Minimal Fatigue)</text>
  <line x1="115" y1="537" x2="140" y2="537" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4,2" />
  <text x="147" y="541" fill="#58a6ff" font-size="9" font-weight="700">12°/s (Tolerable Boundary)</text>
  <line x1="115" y1="555" x2="140" y2="555" stroke="#ff7b72" stroke-width="2.2" />
  <text x="147" y="559" fill="#ff7b72" font-size="9" font-weight="700">&gt; 16°/s (Severe CNS Decay)</text>
  <rect x="46" y="658" width="548" height="98" rx="6" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <text x="58" y="678" fill="#79c0ff" font-size="10.5" font-weight="700">Why CFF is an Objective Biomarker:</text>
  <text x="58" y="696" fill="#C9D1D9" font-size="9.5">• CFF measures retinocortical temporal resolution in the visual cortex.</text>
  <text x="58" y="712" fill="#C9D1D9" font-size="9.5">• A drop &gt; 4 Hz indicates severe central neuro-visual fatigue, directly slowing</text>
  <text x="58" y="728" fill="#C9D1D9" font-size="9.5">  operator reaction latency and elevating missed signal rates.</text>
  <text x="58" y="746" fill="#3fb950" font-size="9.5" font-weight="700">✓ Stable CFF under 4°/s – 12°/s proves presentation velocity protects physiology.</text>
  <rect x="650" y="278" width="580" height="495" rx="8" fill="#1E222B" stroke="#30363D" stroke-width="1.2" />
  <rect x="666" y="292" width="340" height="26" rx="4" fill="#16191F" stroke="#ff7b72" stroke-width="1.2" />
  <text x="674" y="309" fill="#ff7b72" font-size="11" font-weight="700">3. THE DYNAMIC PUPIL DIAMETER FALLACY</text>
  <text x="1020" y="309" fill="#8B949E" font-size="10.5">Antagonistic Push-Pull Model</text>
  <rect x="666" y="333" width="548" height="280" rx="6" fill="#16191F" stroke="#30363D" stroke-width="1" />
  <circle cx="750" cy="463" r="50" fill="#0D1117" stroke="#79c0ff" stroke-width="2" />
  <circle cx="750" cy="463" r="38" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" />
  <circle cx="750" cy="463" r="18" fill="#000000" stroke="#FFFFFF" stroke-width="1.2" />
  <text x="750" y="467" fill="#FFFFFF" font-size="9" font-weight="700" text-anchor="middle">Pupil</text>
  <text x="750" y="529" fill="#C9D1D9" font-size="9.5" font-weight="700" text-anchor="middle">Net Δr ≈ 0 mm</text>
  <text x="750" y="541" fill="#8B949E" font-size="8.5" text-anchor="middle">(Statistically Insignificant, p &gt; 0.05)</text>
  <rect x="860" y="353" width="338" height="95" rx="5" fill="#2C1517" stroke="#ff7b72" stroke-width="1" />
  <text x="872" y="371" fill="#ff7b72" font-size="10" font-weight="700">Pathway A: Parasympathetic Fatigue</text>
  <text x="872" y="387" fill="#C9D1D9" font-size="9">• Visual &amp; cognitive fatigue accumulation</text>
  <text x="872" y="401" fill="#C9D1D9" font-size="9">• Sphincter pupillae contraction (Miosis)</text>
  <text x="872" y="419" fill="#ff7b72" font-size="10" font-weight="700">Vector: Constriction (-Δr)</text>
  <line x1="845" y1="448" x2="774" y2="455" stroke="#ff7b72" stroke-width="2" marker-end="url(#arr-red)" />
  <rect x="860" y="478" width="338" height="95" rx="5" fill="#0D1B2A" stroke="#388bfd" stroke-width="1" />
  <text x="872" y="496" fill="#58a6ff" font-size="10" font-weight="700">Pathway B: Sympathetic Motion Tracking</text>
  <text x="872" y="512" fill="#C9D1D9" font-size="9">• Fast target pursuit &amp; mental arousal</text>
  <text x="872" y="526" fill="#C9D1D9" font-size="9">• Dilator pupillae muscle activation</text>
  <text x="872" y="544" fill="#58a6ff" font-size="10" font-weight="700">Vector: Dilation (+Δr)</text>
  <line x1="782" y1="475" x2="845" y2="483" stroke="#388bfd" stroke-width="2" marker-end="url(#arr-blue)" />
  <rect x="666" y="633" width="548" height="122" rx="6" fill="#16191F" stroke="#ff7b72" stroke-width="1.2" />
  <rect x="678" y="645" width="280" height="20" rx="3" fill="#2C1517" />
  <text x="686" y="659" fill="#ff7b72" font-size="10" font-weight="700">ARCHITECTURAL DESIGN INVARIANT:</text>
  <text x="678" y="681" fill="#C9D1D9" font-size="9.5">• In static tasks, pupil diameter reliably measures cognitive workload.</text>
  <text x="678" y="697" fill="#C9D1D9" font-size="9.5">• In dynamic SCADA displays, <tspan fill="#ff7b72" font-weight="700">dilation cancels constriction</tspan> (Tong et al., 2026).</text>
  <text x="678" y="713" fill="#C9D1D9" font-size="9.5">• <tspan fill="#ff7b72" font-weight="700">Strict Rule:</tspan> Never use eye-tracking pupil diameter as an adaptive SCADA</text>
  <text x="678" y="729" fill="#C9D1D9" font-size="9.5">  fatigue trigger; use blink rate and task latency instead.</text>
  <rect x="30" y="794" width="1200" height="32" rx="6" fill="#1E222B" stroke="#30363D" stroke-width="1" />
  <text x="45" y="814" fill="#3fb950" font-size="10" font-weight="700">✓ Grounded Biomarkers</text>
  <text x="200" y="814" fill="#8B949E" font-size="9.5">Spontaneous Blink Rate &amp; Critical Flicker Fusion (CFF) objectively track visual fatigue</text>
  <text x="860" y="814" fill="#ff7b72" font-size="10" font-weight="700">✗ The Pupil Diameter Trap</text>
  <text x="1020" y="814" fill="#8B949E" font-size="9.5">Dilation cancels constriction; net zero variance (p &gt; 0.05)</text>
</svg>