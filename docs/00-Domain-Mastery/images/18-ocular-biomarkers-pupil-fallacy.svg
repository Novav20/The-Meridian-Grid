  <rect width="1260" height="840" rx="12" fill="#16191F" stroke="#30363D" stroke-width="1.5" class="bg" />
  <text x="630" y="36" fill="#F0F6FC" font-size="19" font-weight="700" text-anchor="middle">Ocular Biomarkers &amp; The Dynamic Pupil Diameter Fallacy</text>
  <text x="630" y="58" fill="#8B949E" font-size="12" text-anchor="middle">Tong et al. (2026) · Smooth Pursuit Blink Suppression, CFF Decay &amp; Antagonistic Autonomic Pupillary Cancellation</text>
  <rect x="30" y="82" width="1200" height="180" rx="8" fill="#1E222B" stroke="#30363D" stroke-width="1.2" />
  <rect x="46" y="96" width="360" height="26" rx="4" fill="#16191F" stroke="#388bfd" stroke-width="1.2" />
  <text x="54" y="113" fill="#79c0ff" font-size="11" font-weight="700">1. SMOOTH PURSUIT EYE TRACKING &amp; BLINK SUPPRESSION</text>
  <text x="420" y="113" fill="#8B949E" font-size="10.5">Biomechanical Reflex Inhibition (F(7,133) = 3.749, p &lt; 0.05)</text>
  <rect x="46" y="132" width="378" height="114" rx="6" fill="#16191F" stroke="#3fb950" stroke-width="1" />
  <rect x="58" y="142" width="150" height="20" rx="3" fill="#14261C" />
  <text x="64" y="156" fill="#3fb950" font-size="10" font-weight="700">A. Static / Optimal HMI (&lt; 12°/s)</text>
  <text x="60" y="178" fill="#C9D1D9" font-size="9.5">• Natural saccadic movements between targets</text>
  <text x="60" y="194" fill="#C9D1D9" font-size="9.5">• Spontaneous Blinking: <tspan fill="#3fb950" font-weight="700">15 – 22 blinks/min</tspan></text>
  <text x="60" y="210" fill="#C9D1D9" font-size="9.5">• Normal Tear Film Breakup Time (TBUT &gt; 12s)</text>
  <text x="60" y="230" fill="#3fb950" font-size="9.5" font-weight="700">✓ Healthy Ocular Lubrication &amp; Zero Strain</text>
  <rect x="440" y="132" width="378" height="114" rx="6" fill="#16191F" stroke="#d29922" stroke-width="1" />
  <rect x="452" y="142" width="165" height="20" rx="3" fill="#2C210E" />
  <text x="458" y="156" fill="#e3b341" font-size="10" font-weight="700">B. Rapid Pursuit State (&gt; 16°/s)</text>
  <text x="454" y="178" fill="#C9D1D9" font-size="9.5">• Continuous pursuit locks fovea to moving target</text>
  <text x="454" y="194" fill="#C9D1D9" font-size="9.5">• Brain suppresses lid closure (120ms blind window)</text>
  <text x="454" y="210" fill="#C9D1D9" font-size="9.5">• Blink Rate drops to <tspan fill="#e3b341" font-weight="700">&lt; 4 – 6 blinks/min</tspan></text>
  <text x="454" y="230" fill="#e3b341" font-size="9.5" font-weight="700">⚠ Unconscious Reflex Inhibition Under Speed</text>
  <rect x="834" y="132" width="378" height="114" rx="6" fill="#16191F" stroke="#ff7b72" stroke-width="1" />
  <rect x="846" y="142" width="150" height="20" rx="3" fill="#2C1517" />
  <text x="852" y="156" fill="#ff7b72" font-size="10" font-weight="700">C. Severe Ocular Fatigue State</text>
  <text x="848" y="178" fill="#C9D1D9" font-size="9.5">• Corneal desiccation &amp; tear film evaporation</text>
  <text x="848" y="194" fill="#C9D1D9" font-size="9.5">• Asthenopia, eye burning &amp; blurred vision</text>
  <text x="848" y="210" fill="#C9D1D9" font-size="9.5">• Attentional tunnel vision: peripheral alarm loss</text>
  <text x="848" y="230" fill="#ff7b72" font-size="9.5" font-weight="700">✗ Decision Error Escalation &gt; 35%</text>
  <rect x="30" y="278" width="580" height="495" rx="8" fill="#1E222B" stroke="#30363D" stroke-width="1.2" />
  <rect x="46" y="292" width="340" height="26" rx="4" fill="#16191F" stroke="#388bfd" stroke-width="1.2" />
  <text x="54" y="309" fill="#79c0ff" font-size="11" font-weight="700">2. CRITICAL FLICKER FUSION (CFF) DEGRADATION</text>
  <text x="400" y="309" fill="#8B949E" font-size="10.5">Central Fatigue Metric</text>
  <line x1="85" y1="343" x2="565" y2="343" stroke="#30363D" stroke-width="0.8" stroke-dasharray="2,2" />
  <text x="75" y="347" fill="#8B949E" font-size="9" text-anchor="end">48 Hz</text>
  <line x1="85" y1="408" x2="565" y2="408" stroke="#30363D" stroke-width="0.8" stroke-dasharray="2,2" />
  <text x="75" y="412" fill="#8B949E" font-size="9" text-anchor="end">44 Hz</text>
  <line x1="85" y1="473" x2="565" y2="473" stroke="#30363D" stroke-width="0.8" stroke-dasharray="2,2" />
  <text x="75" y="477" fill="#8B949E" font-size="9" text-anchor="end">40 Hz</text>
  <line x1="85" y1="538" x2="565" y2="538" stroke="#30363D" stroke-width="0.8" stroke-dasharray="2,2" />
  <text x="75" y="542" fill="#8B949E" font-size="9" text-anchor="end">36 Hz</text>
  <line x1="85" y1="603" x2="565" y2="603" stroke="#30363D" stroke-width="0.8" stroke-dasharray="2,2" />
  <text x="75" y="607" fill="#8B949E" font-size="9" text-anchor="end">32 Hz</text>
  <text x="55" y="333" fill="#79c0ff" font-size="9.5" font-weight="700">CFF (Hz)</text>
  <line x1="85" y1="343" x2="85" y2="603" stroke="#30363D" stroke-width="0.8" stroke-dasharray="1,2" />
  <text x="85" y="619" fill="#C9D1D9" font-size="9.5" font-weight="700" text-anchor="middle">0 min</text>
  <line x1="205" y1="343" x2="205" y2="603" stroke="#30363D" stroke-width="0.8" stroke-dasharray="1,2" />
  <text x="205" y="619" fill="#C9D1D9" font-size="9.5" font-weight="700" text-anchor="middle">15 min</text>
  <line x1="325" y1="343" x2="325" y2="603" stroke="#30363D" stroke-width="0.8" stroke-dasharray="1,2" />
  <text x="325" y="619" fill="#C9D1D9" font-size="9.5" font-weight="700" text-anchor="middle">30 min</text>
  <line x1="445" y1="343" x2="445" y2="603" stroke="#30363D" stroke-width="0.8" stroke-dasharray="1,2" />
  <text x="445" y="619" fill="#C9D1D9" font-size="9.5" font-weight="700" text-anchor="middle">45 min</text>
  <line x1="565" y1="343" x2="565" y2="603" stroke="#30363D" stroke-width="0.8" stroke-dasharray="1,2" />
  <text x="565" y="619" fill="#C9D1D9" font-size="9.5" font-weight="700" text-anchor="middle">60 min</text>
  <text x="325" y="637" fill="#79c0ff" font-size="10" font-weight="700" text-anchor="middle">Continuous SCADA Dynamic Monitoring Duration</text>
