<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="100%" height="100%" style="background:#16191f; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .title { fill: #f0f6fc; font-size: 17px; font-weight: 700; }
    .subtitle { fill: #8b949e; font-size: 11.5px; }
    .card-box { fill: #0d1117; stroke: #30363d; stroke-width: 1.2; rx: 6; }
    .hdr { font-size: 12px; font-weight: 700; }
    .sub-hdr { font-size: 10px; font-weight: 600; }
    .txt-body { font-size: 9px; fill: #8b949e; }
    .txt-code { font-family: monospace; font-size: 8.5px; }
    .badge { font-size: 8px; font-weight: 700; text-anchor: middle; }
  </style>

  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f85149" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <linearGradient id="monoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d161a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="webGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#13233a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Title & Subtitle -->
  <text x="500" y="27" class="title" text-anchor="middle">Architectural Comparison: Monolithic Desktop SCADA vs. Decoupled Web SCADA</text>
  <text x="500" y="45" class="subtitle" text-anchor="middle">Coupled Runtime Executable &amp; Direct IP Attack Surface vs. Sandboxed Zero-Install Browser &amp; IDMZ Event Fabric</text>

  <!-- ================= LEFT: MONOLITHIC DESKTOP SCADA ================= -->
  <g transform="translate(25, 65)">
    <rect x="0" y="0" width="455" height="450" class="card-box" fill="url(#monoGrad)" stroke="#f85149" stroke-width="1.5" />
    <text x="20" y="24" class="hdr" fill="#ff7b72">1. Legacy Monolithic Desktop SCADA (Generation 2 &amp; 3)</text>
    <text x="20" y="38" class="txt-body">Tightly coupled executable (.exe) bundle locked to x86 Windows workstations</text>

    <!-- Workstation Outer Box -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="415" height="230" rx="5" fill="#0d1117" stroke="#f85149" stroke-width="1.2" />
      <rect x="0" y="0" width="415" height="24" rx="5" fill="#3b1e22" />
      <text x="12" y="16" fill="#ff7b72" font-size="9.5" font-weight="700">Dedicated Windows Operator PC (Local Runtime &gt; 5 GB)</text>

      <!-- Internal Monolith Stack Layers -->
      <g transform="translate(15, 34)">
        <rect x="0" y="0" width="385" height="32" rx="3" fill="#161b22" stroke="#30363d" />
        <text x="12" y="15" fill="#f0f6fc" font-size="9" font-weight="700">Proprietary Graphic Engine (GDI+ / DirectX)</text>
        <text x="12" y="26" class="txt-body">Hardwired UI layouts; modifications require binary compile (.gpk/.pdl) &amp; manual node copy</text>
      </g>
      <g transform="translate(15, 72)">
        <rect x="0" y="0" width="385" height="32" rx="3" fill="#161b22" stroke="#30363d" />
        <text x="12" y="15" fill="#f0f6fc" font-size="9" font-weight="700">Embedded In-Memory Tag Database &amp; Local Alarm Server</text>
        <text x="12" y="26" class="txt-body">Per-seat &amp; per-tag commercial licensing barriers; tag count caps enforce pricing tiers</text>
      </g>
      <g transform="translate(15, 110)">
        <rect x="0" y="0" width="385" height="34" rx="3" fill="#211a1d" stroke="#f85149" />
        <text x="12" y="15" fill="#ff7b72" font-size="9" font-weight="700">Embedded Native Fieldbus Drivers (Modbus TCP, EtherNet/IP, S7)</text>
        <text x="12" y="27" fill="#ff7b72" font-size="8.5">Driver lives inside client UI process; requires direct routable IP socket to PLCs</text>
      </g>
      <g transform="translate(15, 150)">
        <rect x="0" y="0" width="385" height="30" rx="3" fill="#161b22" stroke="#e3b341" />
        <text x="12" y="14" fill="#e3b341" font-size="8.5" font-weight="700">Physical Hardware USB Dongle (HASP / SafeNet)</text>
        <text x="12" y="24" class="txt-body">Physical port lock; dongle failure or OS driver incompatibility halts operations</text>
      </g>
      <g transform="translate(15, 186)">
        <rect x="0" y="0" width="385" height="32" rx="3" fill="#161b22" stroke="#30363d" />
        <text x="12" y="14" fill="#8b949e" font-size="8.5" font-weight="600">Local Configuration Registry &amp; DCOM / OPC DA Bindings</text>
        <text x="12" y="25" class="txt-body">Fragile Windows RPC/DCOM configuration; blocked by standard firewalls</text>
      </g>
    </g>

    <!-- Dangerous Direct IP Routing Arrow -->
    <path d="M 227 280 L 227 340" stroke="#f85149" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arr-red)" />
    <rect x="135" y="298" width="185" height="22" rx="3" fill="#3b1e22" stroke="#f85149" />
    <text x="227" y="312" fill="#ff7b72" font-size="8" font-weight="700" text-anchor="middle">Direct Routable IP Path into OT Network (Port 502)</text>

    <!-- PLC Network Box -->
    <g transform="translate(20, 345)">
      <rect x="0" y="0" width="415" height="85" rx="5" fill="#0d1117" stroke="#f85149" stroke-width="1.2" />
      <text x="12" y="18" fill="#ff7b72" font-size="9.5" font-weight="700">Purdue Level 1/2 Field Controllers (Catastrophic Exposure)</text>
      <text x="12" y="34" class="txt-body">• Direct socket exposure: Operator PC malware (ransomware) directly manipulates PLCs</text>
      <text x="12" y="47" class="txt-body">• 50 client workstations polling PLC simultaneously saturate controller communication co-processor</text>
      <text x="12" y="60" class="txt-body">• Violates IEC 62443 zone segmentation invariants (Zero IDMZ Layer 3 isolation)</text>
      <text x="12" y="74" class="txt-code" fill="#ff7b72">Vulnerability: CVE-2022-38465 / Direct Stuxnet-Style Control Injection</text>
    </g>
  </g>

  <!-- ================= RIGHT: DECOUPLED WEB SCADA ================= -->
  <g transform="translate(520, 65)">
    <rect x="0" y="0" width="455" height="450" class="card-box" fill="url(#webGrad)" stroke="#388bfd" stroke-width="1.5" />
    <text x="20" y="24" class="hdr" fill="#58a6ff">2. Modern Decoupled Web SCADA</text>
    <text x="20" y="38" class="txt-body">Zero-install browser SPA decoupled across IDMZ reverse proxies and event broker</text>

    <!-- Browser Client Box -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="415" height="95" rx="5" fill="#0d1117" stroke="#388bfd" stroke-width="1.2" />
      <rect x="0" y="0" width="415" height="22" rx="5" fill="#162032" />
      <text x="12" y="15" fill="#58a6ff" font-size="9.5" font-weight="700">Zero-Install Browser Client (Chrome, Firefox, Safari, Edge)</text>
      <text x="12" y="36" class="txt-body">• Hardware-accelerated 60 FPS Scene Graph (HTML5 Canvas / SVG; Lesson 14)</text>
      <text x="12" y="49" class="txt-body">• Web Worker off-thread binary parsing via SharedArrayBuffer (Lesson 15)</text>
      <text x="12" y="62" class="txt-body">• Sandboxed browser security context: ZERO access to physical host OS or local network</text>
      <text x="12" y="75" class="txt-body">• Instant live UI refresh: update JSON schema on server; all clients update live</text>
      <g transform="translate(12, 80)">
        <text x="0" y="8" fill="#3fb950" font-size="8" font-weight="700">✓ Unlimited Client Seats at Zero Marginal Software Cost</text>
      </g>
    </g>

    <!-- Arrow from Browser to IDMZ -->
    <path d="M 227 145 L 227 185" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr-blue)" />
    <text x="232" y="168" fill="#79c0ff" font-size="8" font-family="monospace">WSS :443 (TLS 1.3)</text>

    <!-- IDMZ Server Cluster Box -->
    <g transform="translate(20, 185)">
      <rect x="0" y="0" width="415" height="110" rx="5" fill="#0d1117" stroke="#388bfd" stroke-width="1.2" />
      <rect x="0" y="0" width="415" height="22" rx="5" fill="#1f3a5f" />
      <text x="12" y="15" fill="#f0f6fc" font-size="9.5" font-weight="700">Purdue Level 3.5: Industrial DMZ (IDMZ Cluster)</text>
      <text x="12" y="38" class="txt-body">• Headless Fastify Gateway: JWT auth, RBAC enforcement, session validation</text>
      <text x="12" y="51" class="txt-body">• Unified Namespace (UNS) MQTT Broker: Sparkplug B topic distribution (Lesson 06)</text>
      <text x="12" y="64" class="txt-body">• TimescaleDB Historian: In-memory batch accumulation &amp; hypertable persistence</text>
      <text x="12" y="77" class="txt-body">• Terminating Reverse Proxy: Only Port 443 permitted through outer firewall</text>
      <g transform="translate(12, 88)">
        <rect x="0" y="0" width="391" height="16" rx="2" fill="#1b4725" stroke="#2ea043" />
        <text x="195" y="12" fill="#3fb950" font-size="8" font-weight="700" text-anchor="middle">✓ Complete Reverse-Access Isolation: No Direct Ingress to OT</text>
      </g>
    </g>

    <!-- Arrow from IDMZ to Edge Gateways -->
    <path d="M 227 295 L 227 340" stroke="#3fb950" stroke-width="2" marker-end="url(#arr-green)" />
    <text x="232" y="322" fill="#3fb950" font-size="8" font-family="monospace">MQTTS :8883 (Outbound-Only)</text>

    <!-- Level 1/2 Edge Tier Box -->
    <g transform="translate(20, 345)">
      <rect x="0" y="0" width="415" height="85" rx="5" fill="#0d1117" stroke="#3fb950" stroke-width="1.2" />
      <text x="12" y="18" fill="#3fb950" font-size="9.5" font-weight="700">Purdue Level 2: Dual-Homed EoN Edge Gateways (Protected OT)</text>
      <text x="12" y="34" class="txt-body">• Dual isolated NICs: net.ipv4.ip_forward = 0 enforces physical Layer 3 air-gap</text>
      <text x="12" y="47" class="txt-body">• Single gateway polls local PLCs; shields field controllers from external client load</text>
      <text x="12" y="60" class="txt-body">• Outbound-only TLS: Edge node initiates connection; Zero inbound firewall pinholes</text>
      <text x="12" y="74" class="txt-code" fill="#7ee787">Security Guarantee: 100% IEC 62443 Zone Isolation &amp; Zero Stuxnet Exposure</text>
    </g>
  </g>
</svg>